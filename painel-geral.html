<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Geral – LogFit</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  :root {
    --laranja: #ff5a1f;
    --laranja2: #ff7a3e;
    --azul-escuro: #0f172a;
    --cinza-claro: #f1f5f9;
    --texto: #1e293b;
  }

  body {
    font-family: "Segoe UI", sans-serif;
    background: #fff;
    color: var(--texto);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  header {
    background: linear-gradient(90deg, var(--laranja), var(--laranja2));
    color: white;
    padding: 18px 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }

  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  #logout {
    background: #fff;
    color: var(--laranja);
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
  }

  #logout:hover {
    background: #fff5f0;
    transform: scale(1.05);
  }

  /* ===== MAIN ===== */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  h2 {
    font-size: 28px;
    color: var(--laranja);
    font-weight: 700;
    margin-bottom: 10px;
  }

  p.subtitulo {
    font-size: 15px;
    color: #475569;
    margin-bottom: 40px;
  }

  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
  }

  .card {
    width: 260px;
    height: 200px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    transition: 0.3s;
    border: 1px solid #e2e8f0;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 18px rgba(255, 90, 31, 0.25);
    border-color: var(--laranja2);
  }

  .card .icon {
    font-size: 45px;
    color: var(--laranja);
    background: rgba(255, 90, 31, 0.1);
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }

  .card h3 {
    font-size: 17px;
    font-weight: 700;
    color: var(--azul-escuro);
    margin: 6px 0;
  }

  .card p {
    font-size: 13px;
    color: #64748b;
  }

  /* ===== FOOTER ===== */
  footer {
    text-align: center;
    padding: 15px;
    font-size: 13px;
    color: #64748b;
    background: var(--cinza-claro);
    border-top: 1px solid #e2e8f0;
  }
</style>
</head>
<body>

<header>
  <h1>📊 Painel Geral – LogFit</h1>
  <button id="logout" onclick="sair()">Sair</button>
</header>

<main>
  <h2>Bem-vindo à Central de Projetos</h2>
  <p class="subtitulo">Escolha uma das opções abaixo para continuar</p>

  <div class="cards">
    <a href="home.html" class="card">
      <div class="icon">🏠</div>
      <h3>Página Inicial</h3>
      <p>Acompanhar todos os projetos</p>
    </a>

    <a href="index.html" class="card">
      <div class="icon">🗂️</div>
      <h3>Incluir / Editar Projetos</h3>
      <p>Cadastrar e atualizar dados</p>
    </a>
  </div>
</main>

<footer>© LogFit Logística • Refit • 2025</footer>

<script>
function sair() {
  localStorage.removeItem("usuarioLogado");
  window.location.href = "login.html";
}
</script>

</body>
</html>
