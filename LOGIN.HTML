<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – LogFit</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",sans-serif;display:flex;height:100vh;overflow:hidden;}
.left{flex:1;background:url("./images/caminhoes-frota-fit.png") center/cover no-repeat;}
.right{flex:1;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;padding:40px;}
.logo{width:100px;margin-bottom:20px;}
.version{font-size:12px;color:#94a3b8;margin-bottom:25px;}
form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;}
label{font-size:13px;color:#334155;font-weight:600;}
.input-group{position:relative;}
input{width:100%;padding:12px 38px 12px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;color:#0f172a;transition:.2s;}
input:focus{outline:none;border-color:#ff5a1f;box-shadow:0 0 6px rgba(255,90,31,0.3);}
.toggle-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#ff5a1f;font-size:16px;transition:.3s;}
.toggle-password:hover{transform:scale(1.15) translateY(-50%);}
button.login-btn{background:#ff5a1f;color:white;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;transition:.3s;margin-top:5px;}
button.login-btn:hover{background:#ff7a3e;box-shadow:0 3px 10px rgba(255,90,31,0.3);}
.forgot{text-align:right;font-size:12px;}
.forgot a{text-decoration:none;color:#64748b;}
.forgot a:hover{color:#ff5a1f;}
footer{position:absolute;bottom:10px;font-size:12px;color:#94a3b8;}
.msg{margin-top:10px;font-size:13px;}
@media(max-width:850px){body{flex-direction:column;}.left{height:40vh;}.right{height:60vh;}}
</style>
</head>
<body>
<div class="left"></div>
<div class="right">
  <img src="./images/logo-fit.png" alt="LogFit" class="logo">
  <div class="version">Versão 4.102.33.0.3js</div>

  <form onsubmit="login(event)">
    <label for="usuario">Login</label>
    <input type="email" id="usuario" placeholder="Digite seu email" required>

    <label for="senha">Senha</label>
    <div class="input-group">
      <input type="password" id="senha" placeholder="Digite sua senha" required>
      <button type="button" class="toggle-password" onclick="toggleSenha()">👁️</button>
    </div>

    <button class="login-btn" type="submit">ACESSAR</button>
    <div class="forgot"><a href="#" onclick="resetSenha()">Esqueceu sua senha?</a></div>
    <div class="msg" id="msg"></div>
  </form>

  <footer>© LogFit Logística • Refit • 2025</footer>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

// 🔗 Configuração Supabase
const SUPABASE_URL = 'https://cczuqesooeguvqimeoks.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg'
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

window.toggleSenha = function() {
  const input = document.getElementById("senha")
  input.type = input.type === "password" ? "text" : "password"
}

window.login = async function(event) {
  event.preventDefault()
  const usuario = document.getElementById("usuario").value.trim()
  const senha = document.getElementById("senha").value.trim()
  const msg = document.getElementById("msg")

  msg.textContent = "⏳ Verificando credenciais..."
  msg.style.color = "#475569"

  const { data, error } = await supabase.auth.signInWithPassword({
    email: usuario,
    password: senha
  })

  if (error) {
    msg.textContent = "❌ Usuário ou senha incorretos."
    msg.style.color = "#ef4444"
    return
  }

  msg.textContent = "✅ Login realizado com sucesso!"
  msg.style.color = "#22c55e"
  localStorage.setItem("usuarioLogado", data.user.email)
  setTimeout(() => window.location.href = "painel-geral.html", 1000)
}

// 🧡 Reset de senha (envio de link)
window.resetSenha = async function() {
  const email = prompt("Digite o e-mail para redefinição de senha:")
  if (!email) return

  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: "http://127.0.0.1:5500/reset.html"
  })

  if (error) {
    alert("❌ Erro ao enviar e-mail de redefinição.")
    console.error(error)
  } else {
    alert("📩 E-mail de redefinição enviado! Verifique sua caixa de entrada.")
  }
}
</script>
</body>
</html>
