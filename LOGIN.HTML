<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – LogFit</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",sans-serif;display:flex;height:100vh;overflow:hidden;}
.left{flex:1;background:url("./images/caminhoes-frota-fit.png") center/cover no-repeat;}
.right{flex:1;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;padding:40px;}
.logo{width:100px;margin-bottom:20px;}
.version{font-size:12px;color:#94a3b8;margin-bottom:25px;}
form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;}
label{font-size:13px;color:#334155;font-weight:600;}
.input-group{position:relative;}
input{width:100%;padding:12px 38px 12px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;color:#0f172a;transition:.2s;}
input:focus{outline:none;border-color:#ff5a1f;box-shadow:0 0 6px rgba(255,90,31,0.3);}
.toggle-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#ff5a1f;font-size:16px;transition:.3s;}
.toggle-password:hover{transform:scale(1.15) translateY(-50%);}
button.login-btn{background:#ff5a1f;color:white;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;transition:.3s;margin-top:5px;}
button.login-btn:hover{background:#ff7a3e;box-shadow:0 3px 10px rgba(255,90,31,0.3);}
.forgot{text-align:right;font-size:12px;}
.forgot a{text-decoration:none;color:#64748b;}
.forgot a:hover{color:#ff5a1f;}
footer{position:absolute;bottom:10px;font-size:12px;color:#94a3b8;}
@media(max-width:850px){body{flex-direction:column;}.left{height:40vh;}.right{height:60vh;}}
</style>
</head>
<body>
<div class="left"></div>
<div class="right">
  <img src="./images/logo-fit.png" alt="LogFit" class="logo">
  <div class="version">Versão 4.102.33.0.2js</div>
  <form onsubmit="login();return false;">
    <label for="usuario">Login</label>
    <input type="text" id="usuario" placeholder="Digite seu login">
    <label for="senha">Senha</label>
    <div class="input-group">
      <input type="password" id="senha" placeholder="Digite sua senha">
      <button type="button" class="toggle-password" onclick="toggleSenha()">👁️</button>
    </div>
    <button class="login-btn" type="submit">ACESSAR</button>
    <div class="forgot"><a href="#">Esqueceu sua senha?</a></div>
  </form>
  <footer>© LogFit Logística • Refit • 2025</footer>
</div>
<script>
function toggleSenha(){
  const input=document.getElementById("senha");
  input.type=input.type==="password"?"text":"password";
}
function login(){
  const usuario=document.getElementById("usuario").value.trim();
  const senha=document.getElementById("senha").value.trim();
  if(usuario==="admin"&&senha==="1234"){
    localStorage.setItem("usuarioLogado",usuario);
    window.location.href="painel-geral.html";
  }else{
    alert("Usuário ou senha incorretos.");
  }
}
</script>
</body>
</html>
