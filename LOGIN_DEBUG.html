<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentação – LogFit</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f8fafc;
  margin: 0;
  color: #0f172a;
}
header {
  background: linear-gradient(90deg, #ff5a1f, #ff7a3e);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 30px;
  box-shadow: 0 3px 8px rgba(0,0,0,.2);
}
header h2 {margin:0;font-size:20px;}
header button {
  background:white;color:#ff5a1f;border:none;
  padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;
}
header button:hover {background:#ffe4d2;}

h1 {
  text-align:center;
  color:#ff5a1f;
  margin:40px 0 30px;
}

table {
  width:90%;
  margin:20px auto;
  border-collapse:collapse;
  background:white;
  border-radius:12px;
  box-shadow:0 3px 8px rgba(0,0,0,0.1);
}
thead {
  background:#ff5a1f;
  color:white;
}
th,td {
  padding:12px 14px;
  text-align:left;
  border-bottom:1px solid #e2e8f0;
}
th:first-child, td:first-child {
  width:40px;
}
tr:hover td {
  background:#f9fafb;
}
footer {
  text-align:center;
  padding:14px;
  color:#64748b;
  background:#f8fafc;
  border-top:1px solid #e2e8f0;
  margin-top:60px;
}
</style>
</head>
<body>

<header>
  <h2>📘 Tela de Documentação – LogFit</h2>
  <button onclick="location.href='painel-central.html'">⬅ Voltar</button>
</header>

<h1>Atas</h1>
<table>
  <thead>
    <tr>
      <th></th>
      <th>Nome do Projeto</th>
      <th>Categoria</th>
      <th>Área</th>
      <th>Criado Por</th>
      <th>Criado Em</th>
      <th>Link</th>
    </tr>
  </thead>
  <tbody id="tabelaAtas"></tbody>
</table>

<h1>Requisitos</h1>
<table>
  <thead>
    <tr>
      <th></th>
      <th>Nome do Projeto</th>
      <th>Categoria</th>
      <th>Área</th>
      <th>Criado Por</th>
      <th>Criado Em</th>
      <th>Link</th>
    </tr>
  </thead>
  <tbody id="tabelaRequisitos"></tbody>
</table>

<footer>© LogFit Logística • Refit • 2025</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const SUPABASE_URL='https://cczuqesooeguvqimeoks.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

async function carregarDocumentos() {
  const { data, error } = await supabase.from("projetos").select("*");
  if (error) return console.error(error);

  const atas = data.filter(p => (p.categoria || "").toLowerCase().includes("ata"));
  const requisitos = data.filter(p => (p.categoria || "").toLowerCase().includes("requisito"));

  preencherTabela(document.getElementById("tabelaAtas"), atas);
  preencherTabela(document.getElementById("tabelaRequisitos"), requisitos);
}

function preencherTabela(elemento, lista) {
  elemento.innerHTML = "";
  if (!lista.length) {
    elemento.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#94a3b8;">Nenhum registro encontrado</td></tr>`;
    return;
  }

  lista.forEach(p => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>▶</td>
      <td>${p.nome || "—"}</td>
      <td>${p.categoria || "—"}</td>
      <td>${p.area || "—"}</td>
      <td>${p.responsavel || "—"}</td>
      <td>${p.prazo || "—"}</td>
      <td>${p.doc ? `<a href="${p.doc}" target="_blank" style="color:#0284c7;font-weight:600;">Abrir</a>` : "—"}</td>`;
    elemento.appendChild(tr);
  });
}

carregarDocumentos();
</script>
</body>
</html>
