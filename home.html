<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogFit – Gestão de Projetos</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
body{font-family:"Segoe UI",sans-serif;background:#f8fafc;margin:0;color:#0f172a;}
header{background:linear-gradient(90deg,#ff5a1f,#ff7a3e);color:white;display:flex;justify-content:space-between;align-items:center;padding:16px 30px;box-shadow:0 3px 8px rgba(0,0,0,.2);}
header h2{font-weight:700;font-size:20px;margin:0}
header button{background:white;color:#ff5a1f;border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;transition:.3s;}
header button:hover{background:#ffe4d2}
main{max-width:1300px;margin:30px auto;padding:0 20px}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:25px;margin-bottom:30px;}
.card{flex:1;min-width:200px;background:white;padding:18px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.1);text-align:center;}
.card h3{margin:0;font-size:16px;color:#475569;}
.card span{display:block;font-size:28px;font-weight:700;color:#0f172a;margin-top:5px;}
table{width:100%;border-collapse:collapse;background:white;box-shadow:0 3px 10px rgba(0,0,0,.1);border-radius:12px;overflow:hidden;}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:14px;}
th{background:#e2e8f0;color:#0f172a;font-weight:700;}
tr.etapas-row td{background:#f8fafc;}
.status-badge{padding:3px 8px;border-radius:6px;font-weight:600;font-size:12px;color:white;}
.status-Pendente{background:#ef4444;}
.status-Desenvolvendo{background:#f59e0b;}
.status-Concluído{background:#22c55e;}
.toggle-btn{cursor:pointer;font-size:16px;transition:0.2s;}
.toggle-btn:hover{transform:scale(1.2);}
footer{text-align:center;background:#f8fafc;padding:12px;font-size:13px;color:#64748b;border-top:1px solid #e2e8f0;}
</style>
</head>
<body>
<header>
  <h2>📊 LogFit – Gestão de Projetos</h2>
  <div>
    <button onclick="location.href='index.html'">+ Incluir / Editar Projetos</button>
    <button onclick="location.href='painel-geral.html'">🏠 Página Inicial</button>
    <button onclick="logout()">Sair</button>
  </div>
</header>

<main>
  <section class="cards">
    <div class="card"><h3>Total</h3><span id="total">0</span></div>
    <div class="card"><h3>🟥 Backlog</h3><span id="backlog">0</span></div>
    <div class="card"><h3>🟨 Desenvolvendo</h3><span id="desenvolvendo">0</span></div>
    <div class="card"><h3>🟩 Concluídos</h3><span id="concluidos">0</span></div>
  </section>

  <table id="tabelaProjetos">
    <thead>
      <tr>
        <th></th>
        <th>Projeto</th>
        <th>Área</th>
        <th>Prioridade</th>
        <th>Status</th>
        <th>Responsável</th>
        <th>Prazo</th>
        <th>Anexo</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<footer>© LogFit Logística • Refit • 2025</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const SUPABASE_URL = 'https://cczuqesooeguvqimeoks.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔒 Verifica se o usuário está logado
const { data: { session } } = await supabase.auth.getSession();
if (!session) {
  window.location.href = "login.html";
}

// Carregar projetos
const { data: projetos, error } = await supabase.from('projetos').select('*').order('id', { ascending: true });
if (error) console.error('Erro ao carregar projetos:', error);

// Atualiza cards
document.getElementById("total").textContent = projetos.length;
document.getElementById("backlog").textContent = projetos.filter(p => p.status === "Backlog").length;
document.getElementById("desenvolvendo").textContent = projetos.filter(p => p.status === "Desenvolvendo").length;
document.getElementById("concluidos").textContent = projetos.filter(p => p.status === "Concluído").length;

// Renderizar tabela
const tbody = document.querySelector("#tabelaProjetos tbody");
projetos.forEach(p => {
  const tr = document.createElement("tr");

  // Cores das prioridades
  let corPrioridade = "#86efac"; // verde padrão (baixa)
  if (p.prioridade === "Alta") corPrioridade = "#fca5a5"; // vermelho
  else if (p.prioridade === "Média") corPrioridade = "#fde68a"; // amarelo

  tr.innerHTML = `
    <td><span class="toggle-btn">⯈</span></td>
    <td>${p.nome}</td>
    <td>${p.area}</td>
    <td><span style="background:${corPrioridade};padding:4px 8px;border-radius:6px;font-weight:600;">${p.prioridade}</span></td>
    <td>${p.status}</td>
    <td>${p.responsavel || "—"}</td>
    <td>${p.prazo || "—"}</td>
    <td>${p.doc ? `<a href="${p.doc}" target="_blank">Abrir</a>` : "—"}</td>
  `;
  tbody.appendChild(tr);

  // Linha oculta com as etapas
  const trEtapas = document.createElement("tr");
  trEtapas.classList.add("etapas-row");
  trEtapas.style.display = "none";

  let etapasHTML = "";
  if (p.etapas && Array.isArray(p.etapas) && p.etapas.length > 0) {
    p.etapas.forEach(e => {
      etapasHTML += `
        <div style="border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:8px;">
          <strong>${e.nome || "Etapa sem nome"}</strong><br>
          <span class="status-badge status-${e.status}">${e.status}</span><br>
          <small>Responsável: ${e.responsavel || "—"} | Prazo: ${e.prazo || "—"}</small><br>
          <small>Descrição: ${e.descricao || "—"}</small><br>
          <small>Anexo: ${e.anexo ? `<a href="${e.anexo}" target="_blank">Abrir</a>` : "—"}</small>
        </div>
      `;
    });
  } else {
    etapasHTML = `<em style="color:#64748b;">Nenhuma etapa cadastrada</em>`;
  }

  trEtapas.innerHTML = `<td colspan="8">${etapasHTML}</td>`;
  tbody.appendChild(trEtapas);

  // Toggle
  tr.querySelector(".toggle-btn").addEventListener("click", e => {
    const isOpen = trEtapas.style.display === "table-row";
    trEtapas.style.display = isOpen ? "none" : "table-row";
    e.target.textContent = isOpen ? "⯈" : "⯆";
  });
});

// 🔚 Logout
window.logout = async function() {
  await supabase.auth.signOut();
  window.location.href = "login.html";
};
</script>
</body>
</html>
