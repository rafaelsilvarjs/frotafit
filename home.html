<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogFit – Gestão de Projetos</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
:root{
  --laranja:#ff5a1f;
  --laranja2:#ff7a3e;
  --azul:#0f172a;
  --cinza:#f8fafc;
  --cinza2:#e2e8f0;
  --texto:#1e293b;
}
body{
  font-family:"Segoe UI",sans-serif;
  background:var(--cinza);
  color:var(--texto);
  margin:0;
}
/* ===== HEADER ===== */
header{
  background:linear-gradient(90deg,var(--laranja),var(--laranja2));
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 32px;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
}
header h2{margin:0;font-size:20px;font-weight:700;}
header button{
  background:#fff;
  color:var(--laranja);
  border:none;
  padding:8px 14px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  margin-left:8px;
  transition:.3s;
}
header button:hover{background:#ffe4d2;}

/* ===== MAIN ===== */
main{max-width:1300px;margin:30px auto;padding:0 20px;}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:25px;
}
.card{
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 3px 8px rgba(0,0,0,.1);
  text-align:center;
  border-top:4px solid var(--laranja2);
}
.card h3{margin:0;font-size:16px;color:#475569;}
.card span{display:block;font-size:28px;font-weight:700;color:var(--azul);margin-top:5px;}

/* ===== FILTROS ===== */
.filtros{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
}
.filtros select{
  padding:8px 10px;
  border:1px solid var(--cinza2);
  border-radius:6px;
  font-size:14px;
  background:#fff;
}
.filtros button{
  border:none;
  border-radius:6px;
  font-weight:600;
  cursor:pointer;
  padding:8px 14px;
  font-size:14px;
}
.filtros .filtrar{
  background:var(--laranja);
  color:#fff;
}
.filtros .limpar{
  background:#0f172a;
  color:#fff;
}

/* ===== TABELA ===== */
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.1);
  border-radius:12px;
  overflow:hidden;
}
th,td{
  padding:12px 14px;
  text-align:left;
  border-bottom:1px solid var(--cinza2);
  font-size:14px;
}
th{background:#f1f5f9;font-weight:700;color:var(--azul);}
tr.etapas-row td{background:var(--cinza);}
.status-badge{
  padding:3px 8px;
  border-radius:6px;
  font-weight:600;
  font-size:12px;
  color:#fff;
}
.status-Pendente{background:#ef4444;}
.status-Desenvolvendo{background:#f59e0b;}
.status-Concluído{background:#22c55e;}
.toggle-btn{cursor:pointer;font-size:16px;transition:0.2s;}
.toggle-btn:hover{transform:scale(1.2);}
footer{
  text-align:center;
  background:var(--cinza);
  padding:12px;
  font-size:13px;
  color:#64748b;
  border-top:1px solid var(--cinza2);
}
</style>
</head>
<body>
<header>
  <h2>📊 LogFit – Gestão de Projetos</h2>
  <div>
    <button onclick="location.href='index.html'">+ Incluir / Editar Projetos</button>
    <button onclick="location.href='painel-geral.html'">🏠 Página Inicial</button>
    <button onclick="location.href='etapas.html'">📆 SPRINT</button>
    <button onclick="logout()">Sair</button>
  </div>
</header>

<main>
  <!-- CARDS -->
  <section class="cards">
    <div class="card"><h3>Total</h3><span id="total">0</span></div>
    <div class="card"><h3>📁 Backlog</h3><span id="backlog">0</span></div>
    <div class="card"><h3>⚙️ Desenvolvendo</h3><span id="desenvolvendo">0</span></div>
    <div class="card"><h3>✅ Concluídos</h3><span id="concluidos">0</span></div>
  </section>

  <!-- FILTROS -->
  <div class="filtros">
    <select id="filtroArea" onchange="filtrarTabela()">
      <option value="">Filtrar por Área</option>
      <option>Planejamento</option>
      <option>Programação</option>
      <option>Transportadores</option>
      <option>Logística</option>
      <option>Corporativo</option>
    </select>

    <select id="filtroStatus" onchange="filtrarTabela()">
      <option value="">Filtrar por Status</option>
      <option>Backlog</option>
      <option>Desenvolvendo</option>
      <option>Concluído</option>
    </select>

    <select id="filtroPrioridade" onchange="filtrarTabela()">
      <option value="">Filtrar por Prioridade</option>
      <option>Alta</option>
      <option>Média</option>
      <option>Baixa</option>
    </select>

    <select id="filtroResponsavel" onchange="filtrarTabela()">
      <option value="">Filtrar por Responsável</option>
    </select>

    <button class="limpar" onclick="limparFiltros()">🧹 Limpar</button>
  </div>

  <!-- TABELA -->
  <table id="tabelaProjetos">
    <thead>
      <tr>
        <th></th>
        <th>Projeto</th>
        <th>Área</th>
        <th>Prioridade</th>
        <th>Status</th>
        <th>Responsável</th>
        <th>Prazo</th>
        <th>Anexo</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<footer>© LogFit Logística • Refit • 2025</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const SUPABASE_URL='https://cczuqesooeguvqimeoks.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

// 🔒 LOGIN
const {data:{session}}=await supabase.auth.getSession();
if(!session) window.location.href="login.html";

// 📦 CARREGAR PROJETOS
const {data:projetos,error}=await supabase.from('projetos').select('*').order('id',{ascending:true});
if(error) console.error(error);

// Atualiza contadores
document.getElementById("total").textContent=projetos.length;
document.getElementById("backlog").textContent=projetos.filter(p=>p.status==="Backlog").length;
document.getElementById("desenvolvendo").textContent=projetos.filter(p=>p.status==="Desenvolvendo").length;
document.getElementById("concluidos").textContent=projetos.filter(p=>p.status==="Concluído").length;

// Popula responsáveis no filtro
const filtroResp=document.getElementById("filtroResponsavel");
[...new Set(projetos.map(p=>p.responsavel).filter(Boolean))].forEach(r=>{
  const opt=document.createElement("option");
  opt.value=r; opt.textContent=r;
  filtroResp.appendChild(opt);
});

// Renderizar tabela
const tbody=document.querySelector("#tabelaProjetos tbody");
renderTabela(projetos);

function renderTabela(lista){
  tbody.innerHTML="";
  lista.forEach(p=>{
    const tr=document.createElement("tr");
    let cor="#86efac";
    if(p.prioridade==="Alta") cor="#fca5a5";
    else if(p.prioridade==="Média") cor="#fde68a";
    tr.innerHTML=`
      <td><span class="toggle-btn">⯈</span></td>
      <td>${p.nome}</td>
      <td>${p.area}</td>
      <td><span style="background:${cor};padding:4px 8px;border-radius:6px;font-weight:600;">${p.prioridade}</span></td>
      <td>${p.status}</td>
      <td>${p.responsavel||"—"}</td>
      <td>${p.prazo||"—"}</td>
      <td>${p.doc?`<a href="${p.doc}" target="_blank">Abrir</a>`:"—"}</td>`;
    tbody.appendChild(tr);

    const trSprints=document.createElement("tr");
    trSprints.classList.add("etapas-row");
    trSprints.style.display="none";
    let sprintsHTML="";
    if(p.etapas&&Array.isArray(p.etapas)&&p.etapas.length>0){
      p.etapas.forEach(e=>{
        sprintsHTML+=`
          <div style="border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:8px;">
            <strong>${e.nome||"Sprint sem nome"}</strong><br>
            <span class="status-badge status-${e.status}">${e.status}</span><br>
            <small>Responsável: ${e.responsavel||"—"} | Prazo: ${e.prazo||"—"}</small><br>
            <small>Descrição: ${e.descricao||"—"}</small><br>
            <small>Anexo: ${e.anexo?`<a href="${e.anexo}" target="_blank">Abrir</a>`:"—"}</small>
          </div>`;
      });
    } else sprintsHTML=`<em style="color:#64748b;">Nenhuma sprint cadastrada</em>`;
    trSprints.innerHTML=`<td colspan="8">${sprintsHTML}</td>`;
    tbody.appendChild(trSprints);

    tr.querySelector(".toggle-btn").addEventListener("click",e=>{
      const open=trSprints.style.display==="table-row";
      trSprints.style.display=open?"none":"table-row";
      e.target.textContent=open?"⯈":"⯆";
    });
  });
}

// FILTRAR
window.filtrarTabela=function(){
  const area=document.getElementById("filtroArea").value;
  const status=document.getElementById("filtroStatus").value;
  const prioridade=document.getElementById("filtroPrioridade").value;
  const resp=document.getElementById("filtroResponsavel").value;
  const filtrados=projetos.filter(p=>
    (!area||p.area===area)&&
    (!status||p.status===status)&&
    (!prioridade||p.prioridade===prioridade)&&
    (!resp||p.responsavel===resp)
  );
  renderTabela(filtrados);
}

// LIMPAR
window.limparFiltros=function(){
  document.querySelectorAll(".filtros select").forEach(s=>s.value="");
  renderTabela(projetos);
}

// LOGOUT
window.logout=async function(){
  await supabase.auth.signOut();
  window.location.href="login.html";
};
</script>
</body>
</html>
