<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogFit – Gestão de Projetos</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
:root {
  --laranja:#ff5a1f;
  --laranja2:#ff7a3e;
  --azul:#0f172a;
  --cinza:#f8fafc;
  --cinza2:#e2e8f0;
  --texto:#1e293b;
}
body {
  font-family:"Segoe UI",sans-serif;
  background:var(--cinza);
  color:var(--texto);
  margin:0;
}
/* ===== HEADER ===== */
header {
  background:linear-gradient(90deg,var(--laranja),var(--laranja2));
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 32px;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
}
header h2 {margin:0;font-size:20px;font-weight:700;}
header button {
  background:#fff;
  color:var(--laranja);
  border:none;
  padding:8px 14px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  margin-left:8px;
  transition:.3s;
}
header button:hover {background:#ffe4d2;}
/* ===== MAIN ===== */
main {max-width:1300px;margin:30px auto;padding:0 20px;}
.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:25px;
}
.card {
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 3px 8px rgba(0,0,0,.1);
  text-align:center;
  border-top:4px solid var(--laranja2);
}
.card h3 {margin:0;font-size:16px;color:#475569;}
.card span {display:block;font-size:28px;font-weight:700;color:var(--azul);margin-top:5px;}
/* ===== FILTROS ===== */
.filtros {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin-bottom:20px;
}
.filtros input[type="text"] {
  padding:8px 10px;
  border:1px solid var(--cinza2);
  border-radius:6px;
  font-size:14px;
  width:240px;
}
.dropdown {
  position:relative;
}
.dropdown-button {
  background:#fff;
  border:1px solid var(--cinza2);
  border-radius:6px;
  padding:8px 12px;
  cursor:pointer;
  font-size:14px;
  font-weight:500;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-width:180px;
}
.dropdown-button:hover {background:#f1f5f9;}
.dropdown-content {
  display:none;
  position:absolute;
  top:110%;
  left:0;
  background:#fff;
  border:1px solid var(--cinza2);
  border-radius:8px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  z-index:1000;
  padding:10px 14px;
  max-height:200px;
  overflow-y:auto;
}
.dropdown-content label {
  display:flex;
  align-items:center;
  gap:6px;
  font-size:14px;
  margin-bottom:5px;
  color:#334155;
}
.dropdown.open .dropdown-content {display:block;}
.filtros .limpar {
  background:var(--azul);
  color:#fff;
  border:none;
  border-radius:6px;
  padding:8px 14px;
  font-weight:600;
  cursor:pointer;
  height:38px;
  display:flex;
  align-items:center;
  gap:6px;
}
.filtros .limpar:hover {background:#1e293b;}
/* ===== TABELA ===== */
table {
  width:100%;
  border-collapse:collapse;
  background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.1);
  border-radius:12px;
  overflow:hidden;
}
th,td {
  padding:12px 14px;
  text-align:left;
  border-bottom:1px solid var(--cinza2);
  font-size:14px;
}
th {background:#f1f5f9;font-weight:700;color:var(--azul);}
tr.etapas-row td {background:var(--cinza);}
.status-badge {
  padding:3px 8px;
  border-radius:6px;
  font-weight:600;
  font-size:12px;
  color:#fff;
}
.status-Pendente {background:#ef4444;}
.status-Desenvolvendo {background:#f59e0b;}
.status-Concluído {background:#22c55e;}
.toggle-btn {cursor:pointer;font-size:16px;transition:0.2s;}
.toggle-btn:hover {transform:scale(1.2);}
footer {
  text-align:center;
  background:var(--cinza);
  padding:12px;
  font-size:13px;
  color:#64748b;
  border-top:1px solid var(--cinza2);
}
</style>
</head>
<body>
<header>
  <h2>📊 LogFit – Gestão de Projetos</h2>
  <div>
    <button onclick="location.href='index.html'">+ Incluir / Editar Projetos</button>
    <button onclick="location.href='painel-geral.html'">🏠 Página Inicial</button>
    <button onclick="location.href='etapas.html'">📆 SPRINT</button>
    <button onclick="logout()">Sair</button>
  </div>
</header>

<main>
  <section class="cards">
    <div class="card"><h3>Total</h3><span id="total">0</span></div>
    <div class="card"><h3>📁 Backlog</h3><span id="backlog">0</span></div>
    <div class="card"><h3>⚙️ Desenvolvendo</h3><span id="desenvolvendo">0</span></div>
    <div class="card"><h3>✅ Concluídos</h3><span id="concluidos">0</span></div>
  </section>

  <div class="filtros">
    <input type="text" id="filtroProjeto" placeholder="🔍 Filtrar por nome do projeto...">
    <div class="dropdown" id="areaDropdown">
      <div class="dropdown-button">Filtrar por Área ▾</div>
      <div class="dropdown-content">
        <label><input type="checkbox" value="Planejamento">Planejamento</label>
        <label><input type="checkbox" value="Programação">Programação</label>
        <label><input type="checkbox" value="Transportadores">Transportadores</label>
        <label><input type="checkbox" value="Fiscal">Fiscal</label>
        <label><input type="checkbox" value="Corporativo">Corporativo</label>
      </div>
    </div>

    <div class="dropdown" id="statusDropdown">
      <div class="dropdown-button">Filtrar por Status ▾</div>
      <div class="dropdown-content">
        <label><input type="checkbox" value="Backlog">Backlog</label>
        <label><input type="checkbox" value="Desenvolvendo">Desenvolvendo</label>
        <label><input type="checkbox" value="Concluído">Concluído</label>
      </div>
    </div>

    <div class="dropdown" id="prioridadeDropdown">
      <div class="dropdown-button">Filtrar por Prioridade ▾</div>
      <div class="dropdown-content">
        <label><input type="checkbox" value="Alta">Alta</label>
        <label><input type="checkbox" value="Média">Média</label>
        <label><input type="checkbox" value="Baixa">Baixa</label>
      </div>
    </div>

    <div class="dropdown" id="responsavelDropdown">
      <div class="dropdown-button">Filtrar por Responsável ▾</div>
      <div class="dropdown-content" id="responsavelChecks"></div>
    </div>

    <button class="limpar" onclick="limparFiltros()">🧹 Limpar</button>
  </div>

  <table id="tabelaProjetos">
    <thead>
      <tr>
        <th></th>
        <th>Projeto</th>
        <th>Área</th>
        <th>Prioridade</th>
        <th>Status</th>
        <th>Responsável</th>
        <th>Prazo</th>
        <th>Anexo</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<footer>© LogFit Logística • Refit • 2025</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const SUPABASE_URL='https://cczuqesooeguvqimeoks.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

// 🔒 LOGIN
const { data:{session} }=await supabase.auth.getSession();
if(!session) window.location.href="login.html";

// 📦 CARREGAR PROJETOS
const { data:projetos,error }=await supabase.from('projetos').select('*').order('id',{ascending:true});
if(error) console.error(error);

// Atualiza contadores
document.getElementById("total").textContent=projetos.length;
document.getElementById("backlog").textContent=projetos.filter(p=>p.status==="Backlog").length;
document.getElementById("desenvolvendo").textContent=projetos.filter(p=>p.status==="Desenvolvendo").length;
document.getElementById("concluidos").textContent=projetos.filter(p=>p.status==="Concluído").length;

// Popula responsáveis
const respDiv=document.getElementById("responsavelChecks");
[...new Set(projetos.map(p=>p.responsavel).filter(Boolean))].forEach(r=>{
  const label=document.createElement("label");
  label.innerHTML=`<input type="checkbox" value="${r}">${r}`;
  respDiv.appendChild(label);
});

const tbody=document.querySelector("#tabelaProjetos tbody");
renderTabela(projetos);

// ====== Renderização ======
function renderTabela(lista){
  tbody.innerHTML="";
  lista.forEach(p=>{
    const tr=document.createElement("tr");
    let cor="#86efac";
    if(p.prioridade==="Alta") cor="#fca5a5";
    else if(p.prioridade==="Média") cor="#fde68a";

    tr.innerHTML=`
      <td><span class="toggle-btn">⯈</span></td>
      <td>${p.nome}</td>
      <td>${p.area||"—"}</td>
      <td><span style="background:${cor};padding:4px 8px;border-radius:6px;font-weight:600;">${p.prioridade||"—"}</span></td>
      <td>${p.status||"—"}</td>
      <td>${p.responsavel||"—"}</td>
      <td>${p.prazo||"—"}</td>
      <td>${p.doc?`<a href="${p.doc}" target="_blank">Abrir</a>`:"—"}</td>`;
    tbody.appendChild(tr);

    // ✅ Conversão de etapas para array
    let etapas=[];
    if(Array.isArray(p.etapas)) etapas=p.etapas;
    else if(typeof p.etapas==="string"){
      try{ etapas=JSON.parse(p.etapas)||[]; }catch{ etapas=[]; }
    }

    if(etapas.length>0){
      const etapasTr=document.createElement("tr");
      etapasTr.classList.add("etapas-row");
      etapasTr.style.display="none";
      etapasTr.innerHTML=`
        <td colspan="8">
          <ul style="list-style:none;margin:0;padding:0;">
            ${etapas.map(e=>`
              <li style="padding:8px 0;border-bottom:1px solid #ddd;">
                <b>${e.nome||"Etapa sem nome"}</b> • 
                <span class="status-badge status-${e.status||'Pendente'}">${e.status||'Pendente'}</span> • 
                <small>${e.responsavel||'—'} • ${e.prazo||'—'}</small><br>
                <small style="color:#475569;display:block;margin-top:3px;">📝 ${e.descricao||"Sem descrição"}</small>
                ${e.anexo?`<div style="margin-top:4px;"><a href="${e.anexo}" target="_blank">📎 Anexo</a></div>`:""}
              </li>`).join('')}
          </ul>
        </td>`;
      tbody.appendChild(etapasTr);

      // Evento abrir/recolher
      tr.querySelector('.toggle-btn').addEventListener('click',()=>{
        const aberto=etapasTr.style.display==="table-row";
        etapasTr.style.display=aberto?"none":"table-row";
        tr.querySelector('.toggle-btn').textContent=aberto?"⯈":"⯆";
      });
    }
  });
}

// FILTRAGEM
function filtrarTabela(){
  const nome=document.getElementById("filtroProjeto").value.toLowerCase();
  const areas=[...document.querySelectorAll("#areaDropdown input:checked")].map(i=>i.value);
  const status=[...document.querySelectorAll("#statusDropdown input:checked")].map(i=>i.value);
  const prioridades=[...document.querySelectorAll("#prioridadeDropdown input:checked")].map(i=>i.value);
  const responsaveis=[...document.querySelectorAll("#responsavelDropdown input:checked")].map(i=>i.value);

  const filtrados=projetos.filter(p=>
    (!nome||p.nome?.toLowerCase().includes(nome)) &&
    (areas.length===0||areas.includes(p.area)) &&
    (status.length===0||status.includes(p.status)) &&
    (prioridades.length===0||prioridades.includes(p.prioridade)) &&
    (responsaveis.length===0||responsaveis.includes(p.responsavel))
  );
  renderTabela(filtrados);
}
document.querySelectorAll('.dropdown input, #filtroProjeto').forEach(el=>el.addEventListener('input',filtrarTabela));

// Dropdown abrir/fechar
document.querySelectorAll('.dropdown-button').forEach(btn=>{
  btn.addEventListener('click',()=>btn.parentElement.classList.toggle('open'));
});
document.addEventListener('click',e=>{
  document.querySelectorAll('.dropdown').forEach(dd=>{
    if(!dd.contains(e.target)) dd.classList.remove('open');
  });
});

// LIMPAR
window.limparFiltros=function(){
  document.querySelectorAll('.dropdown input, #filtroProjeto').forEach(el=>{
    if(el.type==="text") el.value="";
    if(el.type==="checkbox") el.checked=false;
  });
  renderTabela(projetos);
}

// LOGOUT
window.logout=async function(){
  await supabase.auth.signOut();
  window.location.href="login.html";
};
</script>
</body>
</html>
