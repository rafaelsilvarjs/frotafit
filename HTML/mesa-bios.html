<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa BIOS – Quadro Scrum</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<style>
  body{font-family:"Segoe UI",sans-serif;background:#f8fafc;margin:0;color:#1e293b}
  header{background:#ff5a1f;color:#fff;padding:16px 30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);position:sticky;top:0;z-index:10}
  header h2{font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.5px}
  header button{background:#fff;color:#ff5a1f;border:none;padding:8px 14px;border-radius:6px;font-weight:bold;cursor:pointer;transition:.3s;margin-left:8px}
  header button:hover{background:#ffe4d2}
  h1{text-align:center;margin:30px 0 10px;font-size:26px;color:#0f172a;font-weight:700}
  #counter{text-align:center;color:#0369a1;font-weight:600;margin-bottom:20px}

  /* Quadro Scrum */
  #board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;padding:0 20px 40px;max-width:1300px;margin:auto;animation:fadeIn .7s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
  .column{background:#fff;border-radius:12px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.1);display:flex;flex-direction:column}
  .column h3{text-align:center;color:#fff;border-radius:8px;padding:8px 0;font-size:15px;margin-bottom:10px}
  .backlog h3{background:#3b82f6}.todo h3{background:#fbbf24;color:#1e293b}.doing h3{background:#f97316}.testing h3{background:#8b5cf6}.done h3{background:#22c55e}
  .card{background:#f1f5f9;border-radius:8px;padding:10px;margin:8px 0;cursor:grab;box-shadow:0 2px 5px rgba(0,0,0,.05);font-size:14px;outline:none;transition:.2s;position:relative}
  .card:focus{background:#e2e8f0}
  .add-btn{background:#0284c7;color:white;border:none;border-radius:8px;padding:8px 10px;margin-top:8px;cursor:pointer;font-size:13px;font-weight:bold;transition:background .3s}
  .add-btn:hover{background:#0369a1}
  .delete-btn{position:absolute;top:4px;right:6px;background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px;display:none}
  .card:hover .delete-btn{display:block}

  /* Visão Giant */
  #giantView{display:none;max-width:1100px;margin:0 auto 50px;animation:fadeIn .6s ease}
  #giantView table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  #giantView th,#giantView td{padding:10px 12px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px}
  #giantView th{background:#e2e8f0;font-weight:600}
  #giantView tr:nth-child(even){background:#f8fafc}
  .status-badge{padding:4px 8px;border-radius:6px;color:#fff;font-weight:600;font-size:13px}
  .status-Backlog{background:#3b82f6}
  .status-AFazer{background:#fbbf24;color:#1e293b}
  .status-EmProgresso{background:#f97316}
  .status-EmTeste{background:#8b5cf6}
  .status-Concluido{background:#22c55e}
  .edit-btn,.remove-btn{border:none;border-radius:6px;padding:6px 10px;margin-right:6px;cursor:pointer;font-weight:600}
  .edit-btn{background:#0284c7;color:white}
  .remove-btn{background:#ef4444;color:white}
</style>
</head>
<body>
<header>
  <h2>MESA BIOS – QUADRO SCRUM</h2>
  <div>
    <button onclick="toggleView()">👁️ Trocar Visão</button>
    <button onclick="location.href='../home.html'">⬅ Voltar</button>
  </div>
</header>

<h1>🧩 Controle Operacional e Demandas BIOS</h1>
<div id="counter">📊 Tarefas: 0 | Concluídas: 0 | Em Andamento: 0</div>

<!-- 🧱 Quadro Scrum -->
<div id="board">
  <div class="column backlog">
    <h3>📁 Backlog</h3>
    <div class="cards"></div>
    <button class="add-btn" onclick="addCard(this)">+ Adicionar</button>
  </div>
  <div class="column todo">
    <h3>📝 A Fazer</h3>
    <div class="cards"></div>
    <button class="add-btn" onclick="addCard(this)">+ Adicionar</button>
  </div>
  <div class="column doing">
    <h3>⚙️ Em Progresso</h3>
    <div class="cards"></div>
    <button class="add-btn" onclick="addCard(this)">+ Adicionar</button>
  </div>
  <div class="column testing">
    <h3>🧪 Em Teste</h3>
    <div class="cards"></div>
    <button class="add-btn" onclick="addCard(this)">+ Adicionar</button>
  </div>
  <div class="column done">
    <h3>✅ Concluído</h3>
    <div class="cards"></div>
    <button class="add-btn" onclick="addCard(this)">+ Adicionar</button>
  </div>
</div>

<!-- 🧩 Visão Giant -->
<div id="giantView">
  <table>
    <thead>
      <tr>
        <th>Tarefa</th>
        <th>Etapa</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="giantTableBody"></tbody>
  </table>
</div>

<script>
function addCard(button){
  const col=button.previousElementSibling;
  const card=document.createElement("div");
  card.className="card";
  card.contentEditable="true";
  card.draggable=true;
  card.innerText="Nova tarefa...";
  card.addEventListener("dragstart",drag);
  card.addEventListener("focus",()=>card.draggable=false);
  card.addEventListener("blur",()=>{card.draggable=true;saveBoard();});
  const del=document.createElement("button");
  del.className="delete-btn";
  del.textContent="🗑️";
  del.onclick=function(){card.remove();saveBoard();};
  card.appendChild(del);
  col.appendChild(card);
  saveBoard();
}

function drag(e){e.dataTransfer.setData("text/plain",e.target.outerHTML);e.target.classList.add("dragging");}

document.querySelectorAll(".cards").forEach(col=>{
  col.addEventListener("dragover",e=>e.preventDefault());
  col.addEventListener("drop",e=>{
    e.preventDefault();
    const dragging=document.querySelector(".dragging");
    if(dragging){
      dragging.classList.remove("dragging");
      e.currentTarget.appendChild(dragging);
    }else{
      const data=e.dataTransfer.getData("text/plain");
      col.insertAdjacentHTML("beforeend",data);
      const newCard=col.lastElementChild;
      newCard.addEventListener("dragstart",drag);
      newCard.addEventListener("focus",()=>newCard.draggable=false);
      newCard.addEventListener("blur",()=>{newCard.draggable=true;saveBoard();});
      const del=newCard.querySelector(".delete-btn");
      del.onclick=function(){newCard.remove();saveBoard();};
    }
    saveBoard();
  });
});

function updateCounter(){
  const cards=[...document.querySelectorAll(".card")].filter(c=>c.innerText.trim()!=="" && c.innerText.trim()!=="Nova tarefa...");
  const total=cards.length;
  const done=document.querySelectorAll(".done .card").length;
  const doing=document.querySelectorAll(".doing .card").length;
  document.getElementById("counter").textContent=`📊 Tarefas: ${total} | Concluídas: ${done} | Em Andamento: ${doing}`;
}

function saveBoard(){
  localStorage.setItem(document.title,document.getElementById("board").innerHTML);
  updateCounter();
}

function loadBoard(){
  const saved=localStorage.getItem(document.title);
  if(saved){
    document.getElementById("board").innerHTML=saved;
    document.querySelectorAll(".card").forEach(c=>{
      c.addEventListener("dragstart",drag);
      c.addEventListener("focus",()=>c.draggable=false);
      c.addEventListener("blur",()=>{c.draggable=true;saveBoard();});
      const del=c.querySelector(".delete-btn");
      if(del) del.onclick=function(){c.remove();saveBoard();};
    });
    document.querySelectorAll(".add-btn").forEach(b=>b.addEventListener("click",()=>addCard(b)));
  }
  updateCounter();
  renderGiantView();
}

/* =====================
   🧩 Visão Giant
===================== */
function renderGiantView(){
  const tbody=document.getElementById("giantTableBody");
  tbody.innerHTML="";
  const allColumns=document.querySelectorAll(".column");
  allColumns.forEach(col=>{
    const status=col.querySelector("h3").innerText;
    col.querySelectorAll(".card").forEach(c=>{
      const text=c.textContent.replace("🗑️","").trim();
      if(!text||text==="Nova tarefa...")return;
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${text}</td>
        <td><span class="status-badge status-${status.replace(/[^\w]/g,"")}">${status}</span></td>
        <td>
          <button class="edit-btn" onclick="editTask('${text}','${status}')">Editar</button>
          <button class="remove-btn" onclick="deleteTask('${text}')">Excluir</button>
        </td>`;
      tbody.appendChild(tr);
    });
  });
}

function editTask(task,status){
  alert(`✏️ Edite a tarefa diretamente na coluna "${status}" no quadro Scrum.`);
}
function deleteTask(task){
  const cards=[...document.querySelectorAll(".card")];
  const target=cards.find(c=>c.textContent.includes(task));
  if(target){target.remove();saveBoard();renderGiantView();}
}

function toggleView(){
  const board=document.getElementById("board");
  const giant=document.getElementById("giantView");
  if(board.style.display!=="none"){
    board.style.display="none";
    giant.style.display="block";
    renderGiantView();
  }else{
    board.style.display="grid";
    giant.style.display="none";
  }
}

loadBoard();
</script>
</body>
</html>
