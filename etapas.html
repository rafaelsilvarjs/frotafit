<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma de Etapas – LogFit</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<!-- 📅 Vis.js Timeline -->
<link href="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.0/styles/vis-timeline-graph2d.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.0/standalone/umd/vis-timeline-graph2d.min.js"></script>

<!-- 📸 Exportação para PDF/Imagem -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f8fafc;
  margin: 0;
  color: #0f172a;
}
header {
  background: linear-gradient(90deg, #ff5a1f, #ff7a3e);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 30px;
  box-shadow: 0 3px 8px rgba(0,0,0,.2);
}
header h2 {
  font-weight: 700;
  font-size: 20px;
  margin: 0;
}
.botoes { display: flex; gap: 10px; }
button {
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}
button.voltar {
  background: white;
  color: #ff5a1f;
}
button.voltar:hover { background: #ffe4d2; }
button.exportar {
  background: #0284c7;
  color: white;
}
button.exportar:hover { background: #0369a1; }
main {
  max-width: 1250px;
  margin: 30px auto;
  padding: 0 20px;
}
.filtros {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 15px;
}
.filtros input,
.filtros select {
  padding: 8px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: 14px;
}
button.filtrar {
  background: #ff5a1f;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: .3s;
}
button.filtrar:hover { background: #ff7a3e; }
.legenda {
  display: flex;
  gap: 15px;
  align-items: center;
  margin: 10px 0 25px;
  font-size: 13px;
  color: #475569;
}
.legenda div { display: flex; align-items: center; gap: 6px; }
.legenda span {
  width: 15px;
  height: 15px;
  border-radius: 4px;
  display: inline-block;
}
#timeline {
  height: 520px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}
footer {
  text-align: center;
  font-size: 13px;
  color: #64748b;
  padding: 15px;
  margin-top: 25px;
}
.tooltip {
  position: absolute;
  background: #fff;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,.15);
  padding: 10px 12px;
  font-size: 13px;
  max-width: 280px;
  display: none;
  z-index: 2000;
}
.tooltip strong { color: #0f172a; }
.tooltip small { color: #64748b; }
</style>
</head>
<body>

<header>
  <h2>📅 Cronograma de Etapas – LogFit</h2>
  <div class="botoes">
    <button class="exportar" onclick="exportarPDF()">📄 Exportar PDF</button>
    <button class="voltar" onclick="location.href='painel-geral.html'">← Voltar</button>
  </div>
</header>

<main>
  <!-- FILTROS -->
  <div class="filtros">
    <label>De: <input type="date" id="dataInicio"></label>
    <label>Até: <input type="date" id="dataFim"></label>
    <select id="responsavel">
      <option value="">Todos os responsáveis</option>
      <option>RAFAEL</option><option>DIEGO</option><option>JOÃO</option>
      <option>ANTONIO</option><option>LUCAS</option><option>CARLOS</option>
      <option>IVAN</option><option>LUIZ</option><option>EQUIPE</option><option>GRAZI</option>
    </select>
    <select id="status">
      <option value="">Todos os status</option>
      <option>Pendente</option>
      <option>Desenvolvendo</option>
      <option>Concluído</option>
    </select>
    <button class="filtrar" onclick="filtrar()">🔍 Filtrar</button>
  </div>

  <!-- LEGENDA -->
  <div class="legenda">
    <div><span style="background:#ef4444;"></span> Pendente</div>
    <div><span style="background:#f59e0b;"></span> Desenvolvendo</div>
    <div><span style="background:#22c55e;"></span> Concluído</div>
  </div>

  <!-- TIMELINE -->
  <div id="timeline"></div>
</main>

<footer>© LogFit Logística • Refit • 2025</footer>

<!-- TOOLTIP -->
<div id="tooltip" class="tooltip"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL = 'https://cczuqesooeguvqimeoks.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg'
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

let timeline = null

// ======= FUNÇÃO FILTRAR =======
window.filtrar = async function() {
  const inicio = document.getElementById("dataInicio").value
  const fim = document.getElementById("dataFim").value
  const resp = document.getElementById("responsavel").value
  const status = document.getElementById("status").value
  const container = document.getElementById("timeline")
  container.innerHTML = "<p style='padding:20px;color:#64748b;'>⏳ Carregando etapas...</p>"

  const { data: projetos, error } = await supabase.from("projetos").select("*")
  if (error) {
    container.innerHTML = "❌ Erro ao carregar dados."
    return
  }

  const etapas = []
  projetos.forEach(p => {
    if (p.etapas && Array.isArray(p.etapas)) {
      p.etapas.forEach(e => {
        const dentroDoPeriodo = (!inicio || !e.prazo || e.prazo >= inicio) && (!fim || !e.prazo || e.prazo <= fim)
        const matchResp = !resp || (e.responsavel && e.responsavel.toUpperCase().includes(resp))
        const matchStatus = !status || e.status === status

        if (dentroDoPeriodo && matchResp && matchStatus) {
          etapas.push({
            id: `${p.id}-${e.nome}`,
            content: `<b>${e.nome || "Etapa sem nome"}</b>`,
            start: e.prazo || new Date().toISOString().split('T')[0],
            group: p.nome,
            style: `background:${corStatus(e.status)};color:white;border:none;border-radius:6px;padding:4px;`,
            info: e,
            projeto: p.nome
          })
        }
      })
    }
  })

  if (etapas.length === 0) {
    container.innerHTML = "<p style='padding:20px;color:#64748b;'>Nenhuma etapa encontrada no período.</p>"
    return
  }

  const grupos = [...new Set(etapas.map(e => e.group))].map(nome => ({
    id: nome,
    content: `<b>${nome}</b>`
  }))

  container.innerHTML = ""
  const items = new vis.DataSet(etapas)
  const groups = new vis.DataSet(grupos)

  const options = {
    stack: false,
    horizontalScroll: true,
    zoomable: true,
    zoomKey: "ctrlKey",
    orientation: { axis: "top" },
    timeAxis: { scale: "day", step: 1 },
    locale: "pt"
  }

  timeline = new vis.Timeline(container, items, groups, options)

  // ===== Tooltip customizada =====
  const tooltip = document.getElementById("tooltip")
  container.addEventListener("mousemove", e => {
    tooltip.style.left = e.pageX + 15 + "px"
    tooltip.style.top = e.pageY + 15 + "px"
  })
  timeline.on("itemover", props => {
    const etapa = etapas.find(et => et.id === props.item)
    if (etapa) {
      tooltip.innerHTML = `
        <strong>${etapa.info.nome || "Etapa sem nome"}</strong><br>
        <small><b>Projeto:</b> ${etapa.projeto}</small><br>
        <small><b>Responsável:</b> ${etapa.info.responsavel || "—"}</small><br>
        <small><b>Status:</b> ${etapa.info.status || "—"}</small><br>
        <small><b>Prazo:</b> ${etapa.info.prazo || "—"}</small><br>
        <small><b>Descrição:</b> ${etapa.info.descricao || "—"}</small><br>
        ${etapa.info.anexo ? `<small><a href="${etapa.info.anexo}" target="_blank">📎 Abrir Anexo</a></small>` : ""}
      `
      tooltip.style.display = "block"
    }
  })
  timeline.on("itemout", () => tooltip.style.display = "none")
}

// ====== COR DE STATUS ======
function corStatus(status) {
  if (status === "Concluído") return "#22c55e"
  if (status === "Desenvolvendo") return "#f59e0b"
  return "#ef4444"
}

// ====== EXPORTAR PDF ======
window.exportarPDF = async function() {
  const container = document.getElementById("timeline")
  const { jsPDF } = window.jspdf
  const canvas = await html2canvas(container, { scale: 2 })
  const pdf = new jsPDF('l', 'pt', [canvas.width, canvas.height])
  const imgData = canvas.toDataURL('image/png')
  pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height)
  pdf.save('Cronograma_LogFit.pdf')
}
</script>

</body>
</html>
