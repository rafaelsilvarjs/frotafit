<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint – Entregas por Projeto</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<!-- 📅 Vis.js -->
<link href="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.0/styles/vis-timeline-graph2d.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.0/standalone/umd/vis-timeline-graph2d.min.js"></script>

<!-- 📸 Exportar PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family:"Segoe UI",sans-serif;
  background:#f8fafc;
  color:#0f172a;
  margin:0;
}
header {
  background:linear-gradient(90deg,#ff5a1f,#ff7a3e);
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 30px;
  box-shadow:0 3px 8px rgba(0,0,0,.2);
}
header h2 { font-size:20px;margin:0;font-weight:700; }
.botoes { display:flex;gap:10px; }
button {
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
  padding:8px 14px;
}
button.voltar { background:white;color:#ff5a1f; }
button.voltar:hover { background:#ffe4d2; }
button.exportar { background:#0284c7;color:white; }
button.exportar:hover { background:#0369a1; }

main { max-width:1250px;margin:25px auto;padding:0 20px; }
.legenda { display:flex;gap:15px;align-items:center;margin:15px 0;font-size:13px;color:#475569; }
.legenda span { width:14px;height:14px;border-radius:3px;display:inline-block; }

#timeline {
  height:520px;
  background:white;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}
footer {
  text-align:center;
  font-size:13px;
  color:#64748b;
  padding:15px;
  margin-top:25px;
}
.tooltip {
  position:absolute;
  background:white;
  border:1px solid #cbd5e1;
  border-radius:8px;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
  padding:10px 12px;
  font-size:13px;
  max-width:280px;
  display:none;
  z-index:2000;
}
.tooltip strong { color:#0f172a; }
.tooltip small { color:#64748b; }
</style>
</head>

<body>

<header>
  <h2>📅 Entregas por Projeto – LogFit</h2>
  <div class="botoes">
    <button class="exportar" onclick="exportarPDF()">📄 Exportar PDF</button>
    <button class="voltar" onclick="location.href='index.html'">← Voltar</button>
  </div>
</header>

<main>
  <div class="legenda">
    <div><span style="background:#ef4444;"></span> Pendente</div>
    <div><span style="background:#f59e0b;"></span> Desenvolvendo</div>
    <div><span style="background:#22c55e;"></span> Concluído</div>
  </div>

  <div id="timeline"></div>
</main>

<footer>© LogFit Logística • Refit • 2025</footer>

<div id="tooltip" class="tooltip"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

// 🔗 Conexão Supabase
const supabase = createClient(
  'https://cczuqesooeguvqimeoks.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg'
)

window.addEventListener('DOMContentLoaded', carregarSprint)

async function carregarSprint() {
  const container = document.getElementById("timeline")
  container.innerHTML = "<p style='padding:20px;color:#64748b;'>⏳ Carregando entregas...</p>"

  // 📦 Busca todos os projetos
  const { data: projetos, error } = await supabase.from("projetos").select("*")
  if (error) {
    console.error("Erro ao buscar projetos:", error)
    container.innerHTML = "❌ Erro ao carregar etapas."
    return
  }

  const etapas = []

  projetos.forEach(p => {
    let listaEtapas = []
    if (Array.isArray(p.etapas)) {
      listaEtapas = p.etapas
    } else if (typeof p.etapas === "string" && p.etapas.trim() !== "") {
      try { listaEtapas = JSON.parse(p.etapas) } 
      catch { console.warn("Erro JSON no projeto:", p.nome) }
    }

    if (!listaEtapas || listaEtapas.length === 0) return

    listaEtapas.forEach(e => {
      if (!e.prazo) return // só mostra se tiver data definida
      etapas.push({
        id: `${p.id}-${e.nome || Math.random()}`,
        content: `<b>${e.nome || "Etapa sem nome"}</b>`,
        start: e.prazo,
        group: p.nome,
        style: `background:${corStatus(e.status)};color:white;border:none;border-radius:6px;padding:4px;`,
        info: e,
        projeto: p.nome
      })
    })
  })

  if (etapas.length === 0) {
    container.innerHTML = "<p style='padding:20px;color:#64748b;'>Nenhuma etapa com data de entrega encontrada.</p>"
    return
  }

  const grupos = [...new Set(etapas.map(e => e.group))].map(nome => ({
    id: nome, content: `<b>${nome}</b>`
  }))

  container.innerHTML = ""
  const items = new vis.DataSet(etapas)
  const groups = new vis.DataSet(grupos)

  const options = {
    stack:false,
    horizontalScroll:true,
    zoomable:true,
    zoomKey:"ctrlKey",
    orientation:{axis:"top"},
    timeAxis:{scale:"day",step:1},
    locale:"pt"
  }

  const timeline = new vis.Timeline(container, items, groups, options)

  // 🧾 Tooltip
  const tooltip = document.getElementById("tooltip")
  container.addEventListener("mousemove", e => {
    tooltip.style.left = e.pageX + 15 + "px"
    tooltip.style.top = e.pageY + 15 + "px"
  })

  timeline.on("itemover", props => {
    const etapa = etapas.find(et => et.id === props.item)
    if (etapa) {
      tooltip.innerHTML = `
        <strong>${etapa.info.nome || "Etapa sem nome"}</strong><br>
        <small><b>Projeto:</b> ${etapa.projeto}</small><br>
        <small><b>Status:</b> ${etapa.info.status || "—"}</small><br>
        <small><b>Responsável:</b> ${etapa.info.responsavel || "—"}</small><br>
        <small><b>Prazo:</b> ${etapa.info.prazo || "—"}</small><br>
        <small><b>Descrição:</b> ${etapa.info.descricao || "—"}</small><br>
        ${etapa.info.anexo ? `<small><a href="${etapa.info.anexo}" target="_blank">📎 Abrir Anexo</a></small>` : ""}
      `
      tooltip.style.display = "block"
    }
  })
  timeline.on("itemout", () => tooltip.style.display = "none")
}

// 🎨 Cor do status
function corStatus(status) {
  if (status === "Concluído") return "#22c55e"
  if (status === "Desenvolvendo") return "#f59e0b"
  return "#ef4444"
}

// 📤 Exportar PDF
window.exportarPDF = async function() {
  const container = document.getElementById("timeline")
  const { jsPDF } = window.jspdf
  const canvas = await html2canvas(container, { scale:2 })
  const pdf = new jsPDF('l','pt',[canvas.width,canvas.height])
  const imgData = canvas.toDataURL('image/png')
  pdf.addImage(imgData,'PNG',0,0,canvas.width,canvas.height)
  pdf.save('Sprint_LogFit.pdf')
}
</script>

</body>
</html>
