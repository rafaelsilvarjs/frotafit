<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📘 LogFit – Documentação de Atas</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f8fafc;
  margin: 0;
  color: #0f172a;
}
header {
  background: linear-gradient(90deg, #ff5a1f, #ff7a3e);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 30px;
  box-shadow: 0 3px 8px rgba(0,0,0,.2);
}
header h2 {
  font-weight: 700;
  font-size: 20px;
  margin: 0;
}
header div { display: flex; gap: 10px; }
header button {
  background: white;
  color: #ff5a1f;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: .3s;
}
header button:hover { background: #ffe4d2; }

main {
  max-width: 1100px;
  margin: 30px auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}
h1 {
  text-align: center;
  margin-bottom: 25px;
  color: #ff5a1f;
  font-size: 26px;
  font-weight: 700;
}
.btn-novo {
  background: #ff5a1f;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: .3s;
}
.btn-novo:hover { background: #ff7a3e; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  border-radius: 8px;
  overflow: hidden;
}
th, td {
  padding: 10px;
  text-align: left;
  font-size: 14px;
  border-bottom: 1px solid #e2e8f0;
}
th {
  background: #ff7a3e;
  color: white;
}
tr:nth-child(even) { background: #f8fafc; }

a {
  color: #0284c7;
  text-decoration: none;
  font-weight: 600;
}
a:hover { text-decoration: underline; }

.action-btn {
  border: none;
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  font-weight: 600;
  color: white;
}
.edit { background: #0284c7; }
.delete { background: #ef4444; }
.edit:hover { background: #0369a1; }
.delete:hover { background: #b91c1c; }

.modal {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.55);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}
.modal-content {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 400px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.modal-content h3 {
  margin-top: 0;
  color: #ff5a1f;
  text-align: center;
}
input, textarea, select {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
}
.btn-salvar {
  background: #16a34a;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  margin-top: 10px;
}
.btn-salvar:hover { background: #15803d; }
.btn-cancelar {
  background: #475569;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  margin-left: 8px;
}
</style>
</head>

<body>
<header>
  <h2>📘 Tela de Atas – LogFit</h2>
  <div>
    <button onclick="location.href='home.html'">🏠 Home</button>
    <button onclick="location.href='etapas.html'">📅 Sprint / Etapas</button>
  </div>
</header>

<main>
  <h1>🗂️ Cadastro de Atas</h1>
  <button class="btn-novo" onclick="abrirModal()">+ Nova Ata</button>

  <table id="tabelaAtas">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Status</th>
        <th>Área</th>
        <th>Responsável</th>
        <th>Descrição</th>
        <th>Prazo</th>
        <th>Anexo</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<!-- MODAL -->
<div class="modal" id="modalForm">
  <div class="modal-content">
    <h3 id="tituloModal">Nova Ata</h3>
    <input id="nome" placeholder="Nome da Ata">
    <input id="status" placeholder="Status (Ex: Pendente, Concluída)">
    <input id="area" placeholder="Área">
    <input id="responsavel" placeholder="Responsável">
    <textarea id="descricao" placeholder="Descrição"></textarea>
    <input id="prazo" type="date">
    <input id="doc" placeholder="Link do Documento (Anexo)">
    <div style="text-align:right;">
      <button class="btn-salvar" id="btnSalvar">Salvar</button>
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>

<script>
const supabase = window.supabase.createClient(
  "https://cczuqesooeguvqimeoks.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg"
);

let idEditando = null;

// 🔹 Abrir Modal
function abrirModal(item = null) {
  document.getElementById("modalForm").style.display = "flex";
  document.getElementById("tituloModal").innerText = item ? "Editar Ata" : "Nova Ata";
  idEditando = item ? item.id : null;

  document.querySelectorAll("#modalForm input, #modalForm textarea").forEach(i => i.value = "");
  if (item) {
    document.getElementById("nome").value = item.nome || "";
    document.getElementById("status").value = item.status || "";
    document.getElementById("area").value = item.area || "";
    document.getElementById("responsavel").value = item.responsavel || "";
    document.getElementById("descricao").value = item.descricao || "";
    document.getElementById("prazo").value = item.prazo || "";
    document.getElementById("doc").value = item.doc || "";
  }
}

// 🔹 Fechar Modal
function fecharModal() {
  document.getElementById("modalForm").style.display = "none";
}

// 🔹 Salvar
document.getElementById("btnSalvar").addEventListener("click", async () => {
  const nome = nome.value.trim();
  const status = document.getElementById("status").value.trim();
  const area = document.getElementById("area").value.trim();
  const responsavel = document.getElementById("responsavel").value.trim();
  const descricao = document.getElementById("descricao").value.trim();
  const prazo = document.getElementById("prazo").value || null;
  const doc = document.getElementById("doc").value.trim();

  if (!nome) return alert("⚠️ Informe o nome da ata!");

  const dados = { nome, status, area, responsavel, descricao, prazo, doc };

  try {
    let result;
    if (idEditando)
      result = await supabase.from("documentacao_atas").update(dados).eq("id", idEditando);
    else
      result = await supabase.from("documentacao_atas").insert([dados]);

    if (result.error) throw result.error;

    alert("✅ Ata salva com sucesso!");
    fecharModal();
    carregarAtas();
  } catch (err) {
    alert("❌ Erro: " + err.message);
  }
});

// 🔹 Excluir
async function excluir(id) {
  if (confirm("Deseja excluir esta ata?")) {
    const { error } = await supabase.from("documentacao_atas").delete().eq("id", id);
    if (error) alert("Erro ao excluir: " + error.message);
    else {
      alert("🗑️ Ata removida!");
      carregarAtas();
    }
  }
}

// 🔹 Renderizar
function renderizar(atas) {
  const tbody = document.querySelector("#tabelaAtas tbody");
  tbody.innerHTML = "";
  atas.forEach(a => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${a.nome}</td>
      <td>${a.status || "-"}</td>
      <td>${a.area || "-"}</td>
      <td>${a.responsavel || "-"}</td>
      <td>${a.descricao || "-"}</td>
      <td>${a.prazo || "-"}</td>
      <td>${a.doc ? `<a href="${a.doc}" target="_blank">📎</a>` : "-"}</td>
      <td>
        <button class="action-btn edit" onclick='abrirModal(${JSON.stringify(a)})'>✏️</button>
        <button class="action-btn delete" onclick='excluir(${a.id})'>🗑️</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// 🔹 Carregar dados
async function carregarAtas() {
  const { data, error } = await supabase.from("documentacao_atas").select("*").order("id", { ascending: false });
  if (error) {
    console.error(error.message);
    alert("❌ Falha ao carregar dados: " + error.message);
    return;
  }
  renderizar(data);
}

carregarAtas();
</script>
</body>
</html>
