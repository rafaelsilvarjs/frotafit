<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tela de Documentação – LogFit</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #f8fafc;
    margin: 0;
    color: #0f172a;
  }
  header {
    background: linear-gradient(90deg, #ff5a1f, #ff7a3e);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 30px;
    box-shadow: 0 3px 8px rgba(0,0,0,.2);
  }
  header h2 {font-weight: 700;font-size: 20px;margin: 0;}
  header div {display: flex;gap: 10px;}
  header button {
    background: white;
    color: #ff5a1f;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: .3s;
  }
  header button:hover {background: #ffe4d6;}

  main {
    max-width: 1000px;
    margin: 40px auto;
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  h3 {color: #ff5a1f;margin-top: 30px;}

  .btn-novo {
    background: #ff5a1f;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: .3s;
    margin-bottom: 10px;
  }
  .btn-novo:hover {background: #ff7a3e;}

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
  }
  th, td {text-align: left;padding: 10px;}
  th {background: #ff7a3e;color: white;}
  tr:nth-child(even) {background: #f2f2f2;}

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
  }
  .modal-content {
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 400px;
  }
  input {
    width: 100%;
    padding: 8px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .btn-salvar {
    background: #ff5a1f;
    color: white;
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn-salvar:hover {background: #ff7a3e;}
  .btn-cancelar {
    background: #475569;
    color: white;
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
  }
</style>
</head>
<body>
<header>
  <h2>📘 Tela de Documentação – LogFit</h2>
  <div>
    <button onclick="window.location.href='index.html'">🏠 Home</button>
    <button onclick="window.location.href='sprint.html'">📅 Sprint / Etapas</button>
  </div>
</header>

<main>
  <section>
    <h3>Atas</h3>
    <button class="btn-novo" id="btnAta">+ Nova Ata</button>
    <table id="tabelaAtas">
      <thead><tr><th>Projeto</th><th>Status</th><th>Prazo</th><th>Anexo</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h3>Requisitos</h3>
    <button class="btn-novo" id="btnRequisito">+ Novo Requisito</button>
    <table id="tabelaRequisitos">
      <thead><tr><th>Projeto</th><th>Status</th><th>Prazo</th><th>Anexo</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<!-- Modal -->
<div class="modal" id="modalForm">
  <div class="modal-content">
    <h3 id="tituloModal">Novo Registro</h3>
    <input id="nomeProjeto" placeholder="Nome do Projeto">
    <input id="area" placeholder="Área">
    <input id="responsavel" placeholder="Responsável">
    <input id="status" placeholder="Status (ex: Backlog)">
    <input id="prazo" type="date">
    <input id="linkDoc" placeholder="Link do Documento (Anexo)">
    <input id="linkVideo" placeholder="Link do Vídeo (opcional)">
    <button class="btn-salvar" id="btnSalvar">Salvar</button>
    <button class="btn-cancelar" id="btnCancelar">Cancelar</button>
  </div>
</div>

<!-- Script principal -->
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const SUPABASE_URL = "https://gsjbdysadnkyeqbbdkit.supabase.co";
  const SUPABASE_KEY = "YOUR_PUBLIC_ANON_KEY"; // substitua pela sua chave pública
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  let tipoRegistro = "";

  document.addEventListener("DOMContentLoaded", () => {
    const modal = document.getElementById("modalForm");
    const btnAta = document.getElementById("btnAta");
    const btnRequisito = document.getElementById("btnRequisito");
    const btnSalvar = document.getElementById("btnSalvar");
    const btnCancelar = document.getElementById("btnCancelar");

    btnAta.addEventListener("click", () => abrirModal("ata"));
    btnRequisito.addEventListener("click", () => abrirModal("requisito"));
    btnSalvar.addEventListener("click", salvar);
    btnCancelar.addEventListener("click", fecharModal);

    carregarTabelas();
  });

  function abrirModal(tipo) {
    tipoRegistro = tipo;
    document.getElementById("modalForm").style.display = "flex";
    document.getElementById("tituloModal").innerText =
      tipo === "ata" ? "Nova Ata" : "Novo Requisito";
  }

  function fecharModal() {
    document.getElementById("modalForm").style.display = "none";
  }

  async function salvar() {
    const nome = document.getElementById("nomeProjeto").value.trim();
    const area = document.getElementById("area").value.trim() || (tipoRegistro === "ata" ? "Ata" : "Requisito");
    const responsavel = document.getElementById("responsavel").value.trim();
    const status = document.getElementById("status").value.trim() || "Backlog";
    const prazo = document.getElementById("prazo").value;
    const doc = document.getElementById("linkDoc").value.trim();
    const video = document.getElementById("linkVideo").value.trim() || doc;

    const { error } = await supabase.from("projetos").insert([
      { nome, area, responsavel, status, prazo, doc, video }
    ]);

    if (error) {
      alert("Erro ao salvar: " + error.message);
      console.error(error);
    } else {
      alert("✅ Registro salvo com sucesso!");
      fecharModal();
      carregarTabelas();
    }
  }

  async function carregarTabelas() {
    const { data, error } = await supabase.from("projetos").select("*").order("prazo", { ascending: true });
    if (error) {
      console.error(error);
      return;
    }

    const tbodyAtas = document.querySelector("#tabelaAtas tbody");
    const tbodyRequisitos = document.querySelector("#tabelaRequisitos tbody");
    tbodyAtas.innerHTML = "";
    tbodyRequisitos.innerHTML = "";

    data.forEach(p => {
      const linha = `
        <tr>
          <td>${p.nome}</td>
          <td>${p.status}</td>
          <td>${p.prazo || "-"}</td>
          <td><a href="${p.doc}" target="_blank">📎 Abrir</a></td>
        </tr>
      `;
      if (p.area.toLowerCase().includes("ata")) tbodyAtas.innerHTML += linha;
      else tbodyRequisitos.innerHTML += linha;
    });
  }
</script>
</body>
</html>
