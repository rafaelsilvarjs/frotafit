<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tela de Documentação – LogFit</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
body {
  font-family:"Segoe UI",sans-serif;
  background:#f8fafc;
  margin:0;
  color:#0f172a;
}

/* HEADER */
header {
  background:linear-gradient(90deg,#ff5a1f,#ff7a3e);
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 30px;
  box-shadow:0 3px 8px rgba(0,0,0,.2);
}
header h2{margin:0;font-size:20px;font-weight:700;}
header .botoes{display:flex;gap:10px;}
header button{
  background:white;color:#ff5a1f;border:none;
  padding:8px 16px;border-radius:8px;font-weight:600;
  cursor:pointer;transition:.3s;
}
header button:hover{background:#ffe4d2;}

/* TITULOS */
h1{
  text-align:center;
  color:#ff5a1f;
  margin:40px 0 20px;
}

/* FILTROS */
.filtros{
  width:90%;
  margin:0 auto 20px auto;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.filtros input{
  flex:1;
  min-width:150px;
  padding:8px 10px;
  border:1px solid #e2e8f0;
  border-radius:6px;
}
.filtros button{
  background:linear-gradient(90deg,#ff5a1f,#ff7a3e);
  color:white;border:none;border-radius:8px;
  padding:8px 14px;font-weight:600;cursor:pointer;
}
.filtros button:hover{background:#ff6f3a;}

/* FORMULÁRIO OCULTO */
.formulario{
  width:90%;
  margin:0 auto 20px auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 8px rgba(0,0,0,0.1);
  display:none;
  flex-wrap:wrap;
  gap:10px;
}
.formulario input{
  flex:1;
  min-width:140px;
  padding:8px 10px;
  border:1px solid #e2e8f0;
  border-radius:6px;
}
.formulario button{
  background:linear-gradient(90deg,#ff5a1f,#ff7a3e);
  color:white;border:none;border-radius:8px;
  padding:10px 18px;font-weight:600;
  cursor:pointer;transition:.3s;
}
.formulario button:hover{background:#ff6f3a;}

/* BOTÃO MOSTRAR FORM */
.add-btn{
  display:block;
  margin:10px auto;
  background:#fff;
  border:2px solid #ff5a1f;
  color:#ff5a1f;
  padding:8px 16px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}
.add-btn:hover{background:#ff5a1f;color:white;}

/* TABELAS */
table{
  width:90%;
  margin:20px auto;
  border-collapse:collapse;
  background:white;
  border-radius:12px;
  box-shadow:0 3px 8px rgba(0,0,0,0.1);
  overflow:hidden;
}
thead{background:#ff5a1f;color:white;}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #e2e8f0;}
tr:hover td{background:#f9fafb;}

/* FOOTER */
footer{
  text-align:center;
  padding:14px;
  color:#64748b;
  background:#f8fafc;
  border-top:1px solid #e2e8f0;
  margin-top:60px;
}
</style>
</head>
<body>

<header>
  <h2>📘 Tela de Documentação – LogFit</h2>
  <div class="botoes">
    <button onclick="location.href='painel-central.html'">⬅ Voltar</button>
    <button onclick="location.href='home.html'">🏠 Home</button>
    <button onclick="location.href='etapas.html'">📆 Sprint / Etapas</button>
  </div>
</header>

<!-- ========== ATAS ========== -->
<h1>Atas</h1>

<div class="filtros">
  <input type="text" id="filtroProjetoAtas" placeholder="Filtrar por projeto">
  <input type="date" id="filtroDataAtas">
  <input type="text" id="filtroRespAtas" placeholder="Filtrar por responsável">
  <button onclick="filtrarTabela('atas')">Filtrar</button>
  <button onclick="resetarFiltro('atas')">Limpar</button>
</div>

<button class="add-btn" onclick="toggleForm('formAta')">➕ Adicionar Ata</button>

<form id="formAta" class="formulario">
  <input type="text" id="nomeAta" placeholder="Nome do projeto" required>
  <input type="text" id="areaAta" placeholder="Área" required>
  <input type="text" id="responsavelAta" placeholder="Criado por" required>
  <input type="date" id="dataAta" required>
  <input type="url" id="linkAta" placeholder="Link do documento">
  <input type="url" id="videoAta" placeholder="Link do vídeo (opcional)">
  <button type="submit">Salvar Ata</button>
</form>

<table>
  <thead>
    <tr>
      <th>Nome do Projeto</th>
      <th>Categoria</th>
      <th>Área</th>
      <th>Criado Por</th>
      <th>Criado Em</th>
      <th>Link</th>
      <th>Vídeo</th>
    </tr>
  </thead>
  <tbody id="tabelaAtas"></tbody>
</table>

<!-- ========== REQUISITOS ========== -->
<h1>Requisitos</h1>

<div class="filtros">
  <input type="text" id="filtroProjetoReq" placeholder="Filtrar por projeto">
  <input type="date" id="filtroDataReq">
  <input type="text" id="filtroRespReq" placeholder="Filtrar por responsável">
  <button onclick="filtrarTabela('req')">Filtrar</button>
  <button onclick="resetarFiltro('req')">Limpar</button>
</div>

<button class="add-btn" onclick="toggleForm('formReq')">➕ Adicionar Requisito</button>

<form id="formReq" class="formulario">
  <input type="text" id="nomeReq" placeholder="Nome do projeto" required>
  <input type="text" id="areaReq" placeholder="Área" required>
  <input type="text" id="responsavelReq" placeholder="Criado por" required>
  <input type="date" id="dataReq" required>
  <input type="url" id="linkReq" placeholder="Link do documento">
  <button type="submit">Salvar Requisito</button>
</form>

<table>
  <thead>
    <tr>
      <th>Nome do Projeto</th>
      <th>Categoria</th>
      <th>Área</th>
      <th>Criado Por</th>
      <th>Criado Em</th>
      <th>Link</th>
    </tr>
  </thead>
  <tbody id="tabelaReq"></tbody>
</table>

<footer>© LogFit Logística • Refit • 2025</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const supabase = createClient(
  'https://cczuqesooeguvqimeoks.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg'
);

/* === Mostrar/ocultar formulários === */
window.toggleForm = id => {
  const form = document.getElementById(id);
  form.style.display = form.style.display === 'flex' ? 'none' : 'flex';
};

/* === Inserir ATA === */
document.getElementById("formAta").addEventListener("submit", async e=>{
  e.preventDefault();
  const nome=document.getElementById("nomeAta").value;
  const area=document.getElementById("areaAta").value;
  const responsavel=document.getElementById("responsavelAta").value;
  const prazo=document.getElementById("dataAta").value;
  const doc=document.getElementById("linkAta").value;
  const video=document.getElementById("videoAta").value;

  const { data, error } = await supabase.from("projetos").insert([
    { nome, area, responsavel, prazo, doc, video, categoria:"Ata" }
  ]);

  if(error){alert("Erro ao adicionar Ata");console.error(error);}
  else{
    adicionarNaTabela("tabelaAtas",{nome,area,responsavel,prazo,doc,video,categoria:"Ata"});
    e.target.reset();
    toggleForm('formAta');
  }
});

/* === Inserir Requisito === */
document.getElementById("formReq").addEventListener("submit", async e=>{
  e.preventDefault();
  const nome=document.getElementById("nomeReq").value;
  const area=document.getElementById("areaReq").value;
  const responsavel=document.getElementById("responsavelReq").value;
  const prazo=document.getElementById("dataReq").value;
  const doc=document.getElementById("linkReq").value;

  const { data, error } = await supabase.from("projetos").insert([
    { nome, area, responsavel, prazo, doc, categoria:"Requisito" }
  ]);

  if(error){alert("Erro ao adicionar Requisito");console.error(error);}
  else{
    adicionarNaTabela("tabelaReq",{nome,area,responsavel,prazo,doc,categoria:"Requisito"});
    e.target.reset();
    toggleForm('formReq');
  }
});

/* === Preencher Tabelas === */
function adicionarNaTabela(id, p){
  const tabela=document.getElementById(id);
  const tr=document.createElement("tr");
  tr.innerHTML=`
    <td>${p.nome}</td>
    <td>${p.categoria}</td>
    <td>${p.area}</td>
    <td>${p.responsavel}</td>
    <td>${p.prazo}</td>
    <td>${p.doc ? `<a href="${p.doc}" target="_blank">Documento</a>`:"—"}</td>
    ${p.video ? `<td><a href="${p.video}" target="_blank">Vídeo</a></td>` : (id==="tabelaAtas"?"<td>—</td>":"")}
  `;
  tabela.appendChild(tr);
}

/* === Carregar registros existentes === */
async function carregar(){
  const { data, error } = await supabase.from("projetos").select("*");
  if(error) return console.error(error);
  const atas=data.filter(p=>(p.categoria||"").toLowerCase().includes("ata"));
  const reqs=data.filter(p=>(p.categoria||"").toLowerCase().includes("requisito"));
  atas.forEach(p=>adicionarNaTabela("tabelaAtas",p));
  reqs.forEach(p=>adicionarNaTabela("tabelaReq",p));
}
carregar();

/* === Filtros === */
window.filtrarTabela=(tipo)=>{
  const prefix=tipo==="atas"?"Atas":"Req";
  const nome=document.getElementById(`filtroProjeto${prefix}`).value.toLowerCase();
  const data=document.getElementById(`filtroData${prefix}`).value;
  const resp=document.getElementById(`filtroResp${prefix}`).value.toLowerCase();
  const tabela=document.getElementById(`tabela${prefix}`);
  [...tabela.rows].forEach(row=>{
    const [n, , , r, d]=row.cells;
    const matchNome=!nome||n.textContent.toLowerCase().includes(nome);
    const matchResp=!resp||r.textContent.toLowerCase().includes(resp);
    const matchData=!data||d.textContent.includes(data);
    row.style.display=matchNome&&matchResp&&matchData?"":"none";
  });
};

window.resetarFiltro=(tipo)=>{
  const prefix=tipo==="atas"?"Atas":"Req";
  document.getElementById(`filtroProjeto${prefix}`).value="";
  document.getElementById(`filtroData${prefix}`).value="";
  document.getElementById(`filtroResp${prefix}`).value="";
  filtrarTabela(tipo);
};
</script>
</body>
</html>
