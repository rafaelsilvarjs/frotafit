<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentações – LogFit</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f8fafc;
  margin: 0;
  color: #0f172a;
}
header {
  background: linear-gradient(90deg, #ff5a1f, #ff7a3e);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 30px;
  box-shadow: 0 3px 8px rgba(0,0,0,.2);
}
header h2 {
  font-weight: 700;
  font-size: 20px;
  margin: 0;
}
header div {
  display: flex;
  gap: 10px;
}
header button {
  background: white;
  color: #ff5a1f;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: .3s;
}
header button:hover { background: #ffe4d6; }
main {
  padding: 30px;
  max-width: 1100px;
  margin: auto;
}
h3 {
  color: #ff5a1f;
  text-align: center;
  margin: 35px 0 10px;
}
.section {
  background: white;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  margin-bottom: 40px;
  overflow: hidden;
}
.section-header {
  background: #ff5a1f;
  color: white;
  font-weight: 700;
  font-size: 18px;
  padding: 10px 15px;
}
button.add-btn {
  background: #ff5a1f;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  margin: 15px;
  transition: 0.3s;
}
button.add-btn:hover { background: #ff7a3e; }
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 10px;
  border-bottom: 1px solid #e2e8f0;
  text-align: left;
}
th {
  background: #ff5a1f;
  color: white;
}
tr:hover { background: #f1f5f9; }
.details {
  display: none;
  background: #fff7f4;
  padding: 12px 20px;
  border-top: 1px solid #ffd7c2;
}
.expand-btn {
  cursor: pointer;
  background: none;
  border: none;
  font-size: 16px;
}
footer {
  text-align: center;
  padding: 20px;
  color: #64748b;
  font-size: 14px;
}
/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.4);
  justify-content: center;
  align-items: center;
  z-index: 999;
}
.modal-content {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 400px;
  max-width: 90%;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
.modal-content h4 {
  color: #ff5a1f;
  margin-top: 0;
}
input, select {
  width: 100%;
  padding: 8px;
  margin: 5px 0 12px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
}
.btn {
  background: #ff5a1f;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover { background: #ff7a3e; }
</style>
</head>
<body>

<header>
  <h2>📘 Tela de Documentação – LogFit</h2>
  <div>
    <button onclick="window.location.href='index.html'">🏠 Home</button>
    <button onclick="window.location.href='sprint.html'">📅 Sprint / Etapas</button>
  </div>
</header>

<main>
  <!-- ATAS -->
  <div class="section">
    <div class="section-header">Atas</div>
    <button class="add-btn" onclick="abrirModal('Ata')">+ Nova Ata</button>
    <table id="tabela-atas">
      <thead>
        <tr>
          <th></th>
          <th>Projeto</th>
          <th>Categoria</th>
          <th>Área</th>
          <th>Responsável</th>
          <th>Prazo</th>
          <th>Anexo</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- REQUISITOS -->
  <div class="section">
    <div class="section-header">Requisitos</div>
    <button class="add-btn" onclick="abrirModal('Requisito')">+ Novo Requisito</button>
    <table id="tabela-requisitos">
      <thead>
        <tr>
          <th></th>
          <th>Projeto</th>
          <th>Categoria</th>
          <th>Área</th>
          <th>Responsável</th>
          <th>Prazo</th>
          <th>Anexo</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<footer>© LogFit Logística • Refit • 2025</footer>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h4 id="tituloModal">Adicionar Registro</h4>
    <input type="hidden" id="categoria">
    <label>Nome do Projeto</label>
    <input id="nome" type="text">
    <label>Área</label>
    <input id="area" type="text">
    <label>Responsável</label>
    <input id="responsavel" type="text">
    <label>Prazo</label>
    <input id="prazo" type="date">
    <label>Link do Documento (Anexo)</label>
    <input id="doc" type="text" placeholder="https://...">
    <label>Link do Vídeo (opcional)</label>
    <input id="video" type="text" placeholder="https://...">
    <div style="text-align:right;">
      <button class="btn" onclick="salvar()">Salvar</button>
      <button class="btn" style="background:#64748b" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- SUPABASE -->
<!-- SUPABASE -->
<!-- SUPABASE -->
<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = "https://cczuqesooeguvqimeoks.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

const modal = document.getElementById("modal");
let statusAtual = "";
let editandoId = null;

function abrirModal(tipo) {
  statusAtual = tipo;
  document.getElementById("tituloModal").textContent = `Adicionar ${tipo}`;
  modal.style.display = "flex";
}

function fecharModal() {
  modal.style.display = "none";
  limparCampos();
}

function limparCampos() {
  ["nome", "area", "responsavel", "prazo", "doc", "video"].forEach(id => {
    document.getElementById(id).value = "";
  });
}

window.onclick = e => { if (e.target === modal) fecharModal(); };

async function carregar() {
  const { data, error } = await supabase.from("projetos").select("*").order("prazo", { ascending: true });
  if (error) { alert("Erro ao carregar dados!"); console.error(error); return; }

  const atas = data.filter(p => p.status === "Ata");
  const reqs = data.filter(p => p.status === "Requisito");

  renderTabela("tabela-atas", atas);
  renderTabela("tabela-requisitos", reqs);
}

function renderTabela(id, registros) {
  const tbody = document.querySelector(`#${id} tbody`);
  tbody.innerHTML = "";
  registros.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><button class="expand-btn" onclick="toggleDetalhes('${r.id}')">▶</button></td>
      <td>${r.nome || ""}</td>
      <td>${r.status || ""}</td>
      <td>${r.area || ""}</td>
      <td>${r.responsavel || ""}</td>
      <td>${r.prazo || ""}</td>
      <td>${r.anexo ? `<a href="${r.anexo}" target="_blank">Abrir</a>` : "-"}</td>
    `;
    tbody.appendChild(tr);

    const detalhes = document.createElement("tr");
    detalhes.classList.add("details");
    detalhes.id = `detalhes-${r.id}`;
    detalhes.innerHTML = `
      <td colspan="7">
        <b>Responsável:</b> ${r.responsavel || "—"}<br>
        <b>Prazo:</b> ${r.prazo || "—"}<br>
        <b>Anexo:</b> ${r.anexo ? `<a href="${r.anexo}" target="_blank">📎 Abrir Link</a>` : "—"}<br><br>
        <button class="btn" onclick="editar('${r.id}')">Editar</button>
        <button class="btn" style="background:#dc2626" onclick="excluir('${r.id}')">Excluir</button>
      </td>
    `;
    tbody.appendChild(detalhes);
  });
}

function toggleDetalhes(id) {
  const linha = document.getElementById(`detalhes-${id}`);
  linha.style.display = linha.style.display === "table-row" ? "none" : "table-row";
}

async function salvar() {
  const nome = document.getElementById("nome").value.trim();
  const area = document.getElementById("area").value.trim();
  const responsavel = document.getElementById("responsavel").value.trim();
  const prazo = document.getElementById("prazo").value;
  const doc = document.getElementById("doc").value.trim();
  const video = document.getElementById("video").value.trim();
  const status = statusAtual;

  if (!nome || !status) return alert("Preencha os campos obrigatórios!");

  // 🔹 Usa o mesmo campo 'anexo' para doc e video
  const anexo = video || doc;

  const registro = { nome, area, responsavel, prazo, anexo, status };

  let error;
  if (editandoId) {
    ({ error } = await supabase.from("projetos").update(registro).eq("id", editandoId));
  } else {
    ({ error } = await supabase.from("projetos").insert(registro));
  }

  if (error) {
    console.error(error);
    alert("Erro ao salvar: " + (error.message || ""));
    return;
  }

  fecharModal();
  carregar();
}

async function editar(id) {
  const { data, error } = await supabase.from("projetos").select("*").eq("id", id).single();
  if (error) { alert("Erro ao carregar registro!"); return; }

  editandoId = id;
  statusAtual = data.status;
  document.getElementById("tituloModal").textContent = `Editar ${data.status}`;
  modal.style.display = "flex";

  document.getElementById("nome").value = data.nome || "";
  document.getElementById("area").value = data.area || "";
  document.getElementById("responsavel").value = data.responsavel || "";
  document.getElementById("prazo").value = data.prazo ? data.prazo.split("T")[0] : "";
  document.getElementById("doc").value = data.anexo || "";
  document.getElementById("video").value = data.anexo || "";
}

async function excluir(id) {
  if (!confirm("Deseja realmente excluir este registro?")) return;
  const { error } = await supabase.from("projetos").delete().eq("id", id);
  if (error) { alert("Erro ao excluir!"); return; }
  carregar();
}

carregar();
</script>
</body>
</html>
