<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Documentação – LogFit</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root {
      --laranja:#ff5a1f;
      --laranja2:#ff7a3e;
      --azul:#0f172a;
      --cinza:#f8fafc;
      --cinza2:#e2e8f0;
      --texto:#1e293b;
    }
    body {
      font-family: "Segoe UI", sans-serif;
      background: var(--cinza);
      color: var(--texto);
      margin: 0;
    }
    header {
      background: linear-gradient(90deg, var(--laranja), var(--laranja2));
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 30px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .2);
    }
    header h2 { margin: 0; font-weight: 700; }
    header div { display: flex; gap: 10px; }
    header button {
      background: white;
      color: var(--laranja);
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: .3s;
    }
    header button:hover { background: #ffe4d6; }
    section {
      margin: 40px auto;
      max-width: 1200px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    h3 { text-align: center; color: var(--laranja); }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,.05);
    }
    th {
      background: var(--laranja);
      color: white;
      padding: 10px;
      text-align: left;
    }
    td {
      background: #fff;
      padding: 10px;
      border-bottom: 1px solid var(--cinza2);
    }
    tr:hover td { background: #fff5f0; }
    input, select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--cinza2);
    }
    .btn {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-add {
      background: var(--laranja);
      color: white;
      transition: .3s;
    }
    .btn-add:hover { background: var(--laranja2); }
    .btn-edit { background: #ffc107; color: #000; }
    .btn-del { background: #dc3545; color: white; }
    footer {
      text-align: center;
      color: #666;
      font-size: 14px;
      padding: 20px;
    }
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h2>📘 Tela de Documentação – LogFit</h2>
    <div>
      <button onclick="window.location.href='index.html'">⬅ Voltar</button>
      <button onclick="window.location.href='home.html'">🏠 Home</button>
      <button onclick="window.location.href='sprint.html'">📅 Sprint / Etapas</button>
    </div>
  </header>

  <!-- ======== ATAS ======== -->
  <section>
    <h3>Atas</h3>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
      <input id="ata_nome" placeholder="Nome do projeto">
      <input id="ata_area" placeholder="Área">
      <input id="ata_resp" placeholder="Criado por">
      <input type="date" id="ata_data">
      <input id="ata_doc" placeholder="Link do documento">
      <input id="ata_video" placeholder="Link do vídeo (opcional)">
      <button class="btn btn-add" onclick="adicionarRegistro('Ata')">+ Adicionar Ata</button>
    </div>
    <table id="tabelaAtas">
      <thead>
        <tr>
          <th>Nome do Projeto</th><th>Categoria</th><th>Área</th>
          <th>Criado Por</th><th>Criado Em</th><th>Link</th><th>Vídeo</th><th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- ======== REQUISITOS ======== -->
  <section>
    <h3>Requisitos</h3>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
      <input id="req_nome" placeholder="Nome do projeto">
      <input id="req_area" placeholder="Área">
      <input id="req_resp" placeholder="Criado por">
      <input type="date" id="req_data">
      <input id="req_doc" placeholder="Link do documento">
      <button class="btn btn-add" onclick="adicionarRegistro('Requisito')">+ Adicionar Requisito</button>
    </div>
    <table id="tabelaReqs">
      <thead>
        <tr>
          <th>Nome do Projeto</th><th>Categoria</th><th>Área</th>
          <th>Criado Por</th><th>Criado Em</th><th>Link</th><th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <footer>© LogFit Logística • Refit • 2025</footer>

  <script>
    // 🔗 Supabase
    const supabaseUrl = "https://cczuqesoozzpkvvspkic.supabase.co";
    const supabaseKey = "sua_public_key_aqui";
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    // 🚀 Carregar registros existentes
    document.addEventListener("DOMContentLoaded", carregarRegistros);

    async function carregarRegistros() {
      const { data, error } = await supabase.from("projetos").select("*").order("prazo", { ascending: false });
      if (error) return alert("Erro ao carregar registros!");
      renderizarTabela(data);
    }

    // 🎨 Renderização das tabelas
    function renderizarTabela(registros) {
      const atas = registros.filter(r => r.categoria === "Ata");
      const reqs = registros.filter(r => r.categoria === "Requisito");

      const tbodyAta = document.querySelector("#tabelaAtas tbody");
      const tbodyReq = document.querySelector("#tabelaReqs tbody");
      tbodyAta.innerHTML = ""; tbodyReq.innerHTML = "";

      atas.forEach(r => tbodyAta.innerHTML += criarLinha(r));
      reqs.forEach(r => tbodyReq.innerHTML += criarLinha(r));
    }

    // 🧱 Monta linha da tabela
    function criarLinha(r) {
      return `
        <tr>
          <td>${r.nome || "-"}</td>
          <td>${r.categoria}</td>
          <td>${r.area || "-"}</td>
          <td>${r.responsavel || "-"}</td>
          <td>${r.prazo || "-"}</td>
          <td>${r.doc ? `<a href="${r.doc}" target="_blank">Abrir</a>` : "-"}</td>
          ${r.categoria === "Ata" ? `<td>${r.video ? `<a href="${r.video}" target="_blank">🎥</a>` : "-"}</td>` : ""}
          <td>
            <button class="btn btn-edit" onclick="editarRegistro('${r.id}')">✏️</button>
            <button class="btn btn-del" onclick="deletarRegistro('${r.id}')">🗑️</button>
          </td>
        </tr>`;
    }

    // ➕ Adicionar registro
    async function adicionarRegistro(tipo) {
      try {
        const nome = document.getElementById(tipo === "Ata" ? "ata_nome" : "req_nome").value;
        const area = document.getElementById(tipo === "Ata" ? "ata_area" : "req_area").value;
        const resp = document.getElementById(tipo === "Ata" ? "ata_resp" : "req_resp").value;
        const data = document.getElementById(tipo === "Ata" ? "ata_data" : "req_data").value;
        const doc = document.getElementById(tipo === "Ata" ? "ata_doc" : "req_doc").value;
        const video = tipo === "Ata" ? document.getElementById("ata_video").value : null;

        const { error } = await supabase.from("projetos").insert({
          nome, area, responsavel: resp, prazo: data, doc, video, categoria: tipo
        });

        if (error) throw error;
        alert(`${tipo} adicionada com sucesso!`);
        carregarRegistros();
      } catch (e) {
        alert(`Erro ao adicionar ${tipo}`);
        console.error(e);
      }
    }

    // ✏️ Editar
    async function editarRegistro(id) {
      const novoNome = prompt("Novo nome do projeto:");
      if (!novoNome) return;
      const { error } = await supabase.from("projetos").update({ nome: novoNome }).eq("id", id);
      if (error) return alert("Erro ao editar registro!");
      alert("Atualizado com sucesso!");
      carregarRegistros();
    }

    // 🗑️ Deletar
    async function deletarRegistro(id) {
      if (!confirm("Tem certeza que deseja excluir este registro?")) return;
      const { error } = await supabase.from("projetos").delete().eq("id", id);
      if (error) return alert("Erro ao excluir!");
      alert("Registro removido com sucesso!");
      carregarRegistros();
    }
  </script>
</body>
</html>
