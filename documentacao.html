<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tela de Documentação – LogFit</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f8fafc;
  margin: 0;
  color: #0f172a;
}

/* ===== HEADER ===== */
header {
  background: linear-gradient(90deg, #ff5a1f, #ff7a3e);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 30px;
  box-shadow: 0 3px 8px rgba(0,0,0,.2);
}
header h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
}
header .botoes {
  display: flex;
  gap: 10px;
}
header button {
  background: white;
  color: #ff5a1f;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}
header button:hover {
  background: #ffe4d2;
}

/* ===== TITULOS ===== */
h1 {
  text-align: center;
  color: #ff5a1f;
  margin: 40px 0 20px;
}

/* ====== TABELAS ====== */
table {
  width: 90%;
  margin: 20px auto;
  border-collapse: collapse;
  background: white;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  overflow: hidden;
}
thead {
  background: #ff5a1f;
  color: white;
}
th, td {
  padding: 12px 14px;
  text-align: left;
  border-bottom: 1px solid #e2e8f0;
}
th:first-child, td:first-child {
  width: 40px;
  text-align: center;
}
tr:hover td {
  background: #f9fafb;
}
.etapas-row td {
  background: #f8fafc;
}

/* ====== STATUS BADGES ====== */
.status-badge {
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  color: white;
}
.status-Pendente {background: #ef4444;}
.status-Desenvolvendo {background: #f59e0b;}
.status-Concluído {background: #22c55e;}

/* ===== FOOTER ===== */
footer {
  text-align: center;
  padding: 14px;
  color: #64748b;
  background: #f8fafc;
  border-top: 1px solid #e2e8f0;
  margin-top: 60px;
}
</style>
</head>
<body>

<header>
  <h2>📘 Tela de Documentação – LogFit</h2>
  <div class="botoes">
    <button onclick="location.href='painel-central.html'">⬅ Voltar</button>
    <button onclick="location.href='home.html'">🏠 Home</button>
    <button onclick="location.href='etapas.html'">📆 Sprint / Etapas</button>
  </div>
</header>

<h1>Atas</h1>
<table>
  <thead>
    <tr>
      <th></th>
      <th>Nome do Projeto</th>
      <th>Categoria</th>
      <th>Área</th>
      <th>Criado Por</th>
      <th>Criado Em</th>
      <th>Link</th>
    </tr>
  </thead>
  <tbody id="tabelaAtas"></tbody>
</table>

<h1>Requisitos</h1>
<table>
  <thead>
    <tr>
      <th></th>
      <th>Nome do Projeto</th>
      <th>Categoria</th>
      <th>Área</th>
      <th>Criado Por</th>
      <th>Criado Em</th>
      <th>Link</th>
    </tr>
  </thead>
  <tbody id="tabelaRequisitos"></tbody>
</table>

<footer>© LogFit Logística • Refit • 2025</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const SUPABASE_URL='https://cczuqesooeguvqimeoks.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

async function carregarDocumentos() {
  const { data, error } = await supabase.from("projetos").select("*");
  if (error) return console.error(error);

  const atas = data.filter(p => (p.categoria || "").toLowerCase().includes("ata"));
  const requisitos = data.filter(p => (p.categoria || "").toLowerCase().includes("requisito"));

  preencherTabela(document.getElementById("tabelaAtas"), atas);
  preencherTabela(document.getElementById("tabelaRequisitos"), requisitos);
}

function preencherTabela(tabela, lista) {
  tabela.innerHTML = "";
  if (!lista.length) {
    tabela.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#94a3b8;">Nenhum registro encontrado</td></tr>`;
    return;
  }

  lista.forEach(p => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="toggle">▶</td>
      <td>${p.nome || "—"}</td>
      <td>${p.categoria || "—"}</td>
      <td>${p.area || "—"}</td>
      <td>${p.responsavel || "—"}</td>
      <td>${p.prazo || "—"}</td>
      <td>${p.doc ? `<a href="${p.doc}" target="_blank" style="color:#0284c7;font-weight:600;">Abrir</a>` : "—"}</td>
    `;
    tabela.appendChild(tr);

    // ===== Etapas expandíveis =====
    const trEtapas = document.createElement("tr");
    trEtapas.classList.add("etapas-row");
    trEtapas.style.display = "none";

    let etapasHTML = "";
    if (p.etapas && Array.isArray(p.etapas) && p.etapas.length > 0) {
      p.etapas.forEach(e => {
        etapasHTML += `
          <div style="border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:8px;">
            <strong>${e.nome || "Etapa sem nome"}</strong><br>
            <span class="status-badge status-${e.status}">${e.status || "Sem status"}</span><br>
            <small>Responsável: ${e.responsavel || "—"} | Prazo: ${e.prazo || "—"}</small><br>
            <small>Descrição: ${e.descricao || "—"}</small><br>
            <small>Anexo: ${e.anexo ? `<a href="${e.anexo}" target="_blank">Abrir</a>` : "—"}</small>
          </div>
        `;
      });
    } else {
      etapasHTML = `<em style="color:#94a3b8;">Nenhuma etapa cadastrada</em>`;
    }

    trEtapas.innerHTML = `<td colspan="7">${etapasHTML}</td>`;
    tabela.appendChild(trEtapas);

    // Clique para expandir etapas
    tr.querySelector(".toggle").addEventListener("click", e => {
      const aberto = trEtapas.style.display === "table-row";
      trEtapas.style.display = aberto ? "none" : "table-row";
      e.target.textContent = aberto ? "▶" : "▼";
    });
  });
}

carregarDocumentos();
</script>
</body>
</html>
