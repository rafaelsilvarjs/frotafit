<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tela de Documentação – LogFit</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f8fafc;
      margin: 0;
      color: #0f172a;
    }

    header {
      background: linear-gradient(90deg, #ff5a1f, #ff7a3e);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 30px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    header h2 {
      font-weight: 700;
      font-size: 20px;
      margin: 0;
    }

    header div {
      display: flex;
      gap: 10px;
    }

    header button {
      background: white;
      color: #ff5a1f;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    header button:hover {
      background: #ffe4d6;
    }

    main {
      padding: 30px;
    }

    h3 {
      color: #ff5a1f;
      text-align: center;
      margin-bottom: 20px;
    }

    .btn {
      background: #ff5a1f;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff7a3e;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background: #ff5a1f;
      color: white;
    }

    tr:hover {
      background: #f1f5f9;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 400px;
      max-width: 90%;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-content h4 {
      color: #ff5a1f;
      margin-top: 0;
    }

    label {
      font-weight: 600;
      color: #334155;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-family: "Segoe UI", sans-serif;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h2>📘 Tela de Documentação – LogFit</h2>
    <div>
      <button onclick="window.location.href='index.html'">🏠 Home</button>
      <button onclick="window.location.href='sprint.html'">📅 Sprint / Etapas</button>
    </div>
  </header>

  <main>
    <h3>Documentações</h3>
    <button class="btn" id="novaDoc">+ Nova Documentação</button>

    <table id="tabela">
      <thead>
        <tr>
          <th>Nome do Projeto</th>
          <th>Categoria</th>
          <th>Área</th>
          <th>Responsável</th>
          <th>Prazo</th>
          <th>Link</th>
          <th>Vídeo</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <footer>© LogFit Logística • Refit • 2025</footer>

  <!-- MODAL -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h4>Adicionar Documentação</h4>

      <label>Nome do Projeto</label>
      <input id="nome" type="text" />

      <label>Categoria</label>
      <select id="categoria">
        <option value="">Selecione</option>
        <option value="Ata">Ata</option>
        <option value="Requisito">Requisito</option>
        <option value="Relatório">Relatório</option>
      </select>

      <label>Área</label>
      <input id="area" type="text" />

      <label>Responsável</label>
      <input id="responsavel" type="text" />

      <label>Prazo</label>
      <input id="prazo" type="date" />

      <label>Link do Documento</label>
      <input id="doc" type="text" />

      <label>Link do Vídeo (opcional)</label>
      <input id="video" type="text" />

      <div style="text-align: right; margin-top: 15px;">
        <button class="btn" onclick="salvar()">Salvar</button>
        <button class="btn" style="background:#64748b" onclick="fecharModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://<SEU-PROJETO>.supabase.co"; // 🔧 Substitua pelo seu
    const supabaseKey = "public-anon-key"; // 🔧 Substitua pela sua chave pública
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    const modal = document.getElementById("modal");
    const novaDocBtn = document.getElementById("novaDoc");
    let editandoId = null;

    // 🔹 Garante que o botão realmente abre o modal
    novaDocBtn.addEventListener("click", () => {
      modal.style.display = "flex";
      editandoId = null;
      limparCampos();
    });

    function fecharModal() {
      modal.style.display = "none";
    }

    window.onclick = (event) => {
      if (event.target === modal) fecharModal();
    };

    function limparCampos() {
      ["nome", "categoria", "area", "responsavel", "prazo", "doc", "video"].forEach(id => {
        document.getElementById(id).value = "";
      });
    }

    async function carregar() {
      const { data, error } = await supabase.from("projetos").select("*").order("prazo", { ascending: true });
      if (error) return alert("Erro ao carregar dados!");

      const tbody = document.querySelector("#tabela tbody");
      tbody.innerHTML = "";
      data.forEach((p) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.nome || ""}</td>
          <td>${p.categoria || ""}</td>
          <td>${p.area || ""}</td>
          <td>${p.responsavel || ""}</td>
          <td>${p.prazo || ""}</td>
          <td>${p.doc ? `<a href="${p.doc}" target="_blank">Abrir</a>` : "-"}</td>
          <td>${p.video ? `<a href="${p.video}" target="_blank">🎥</a>` : "-"}</td>
          <td><button class="btn" onclick="editar('${p.id}')">Editar</button>
              <button class="btn" style="background:#dc2626" onclick="excluir('${p.id}')">Excluir</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function salvar() {
      const nome = document.getElementById("nome").value.trim();
      const categoria = document.getElementById("categoria").value.trim();
      const area = document.getElementById("area").value.trim();
      const responsavel = document.getElementById("responsavel").value.trim();
      const prazo = document.getElementById("prazo").value;
      const doc = document.getElementById("doc").value.trim();
      const video = document.getElementById("video").value.trim();

      if (!nome || !categoria) return alert("Preencha os campos obrigatórios!");

      const registro = {
        nome,
        categoria,
        area,
        responsavel,
        prazo: prazo || null,
        doc,
        video,
        status: "Backlog"
      };

      let error;
      if (editandoId) {
        ({ error } = await supabase.from("projetos").update(registro).eq("id", editandoId));
      } else {
        ({ error } = await supabase.from("projetos").insert(registro));
      }

      if (error) {
        console.error(error);
        alert("Erro ao salvar: " + (error.message || ""));
        return;
      }

      fecharModal();
      carregar();
    }

    async function editar(id) {
      const { data, error } = await supabase.from("projetos").select("*").eq("id", id).single();
      if (error) return alert("Erro ao carregar registro!");

      editandoId = id;
      modal.style.display = "flex";
      document.getElementById("nome").value = data.nome;
      document.getElementById("categoria").value = data.categoria;
      document.getElementById("area").value = data.area;
      document.getElementById("responsavel").value = data.responsavel;
      document.getElementById("prazo").value = data.prazo ? data.prazo.split("T")[0] : "";
      document.getElementById("doc").value = data.doc;
      document.getElementById("video").value = data.video;
    }

    async function excluir(id) {
      if (!confirm("Deseja realmente excluir esta documentação?")) return;
      const { error } = await supabase.from("projetos").delete().eq("id", id);
      if (error) return alert("Erro ao excluir!");
      carregar();
    }

    carregar();
  </script>
</body>
</html>
