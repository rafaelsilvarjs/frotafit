<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Documentação – LogFit</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f8fafc;
      margin: 0;
      color: #0f172a;
    }
    header {
      background: linear-gradient(90deg, #ff5a1f, #ff7a3e);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 30px;
      box-shadow: 0 3px 8px rgba(0,0,0,.2);
    }
    header h2 { font-weight: 700; margin: 0; }
    header div { display: flex; gap: 10px; }
    header button {
      background: white;
      color: #ff5a1f;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: .3s;
    }
    header button:hover { background: #ffe4d6; }
    main {
      max-width: 1200px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,.1);
    }
    h3 { text-align: center; color: #ff5a1f; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #ff5a1f;
      color: white;
    }
    .btn {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-add { background: #ff5a1f; color: white; }
    .btn-add:hover { background: #ff7a3e; }
    .btn-del { background: #dc3545; color: white; }
    .btn-edit { background: #ffc107; color: #000; }
    footer {
      text-align: center;
      margin-top: 30px;
      color: #666;
      font-size: 14px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 3px 8px rgba(0,0,0,.3);
    }
    .modal-content h4 { margin-top: 0; color: #ff5a1f; }
    .form-group { margin-bottom: 10px; }
    .form-group label { font-weight: 600; display: block; margin-bottom: 5px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h2>📋 Tela de Documentação – LogFit</h2>
    <div>
      <button onclick="window.location.href='index.html'">⬅ Voltar</button>
      <button onclick="window.location.href='home.html'">🏠 Home</button>
      <button onclick="window.location.href='sprint.html'">📅 Sprint / Etapas</button>
    </div>
  </header>

  <main>
    <h3>Gerenciar Documentações</h3>
    <button class="btn btn-add" onclick="abrirModal()">+ Nova Documentação</button>

    <table id="tabela">
      <thead>
        <tr>
          <th>Nome do Projeto</th>
          <th>Categoria</th>
          <th>Área</th>
          <th>Responsável</th>
          <th>Prazo</th>
          <th>Documento</th>
          <th>Vídeo</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <footer>© LogFit Logística • Refit • 2025</footer>

  <!-- Modal -->
  <div class="modal" id="modalForm">
    <div class="modal-content">
      <h4 id="tituloModal">Adicionar Documentação</h4>
      <div class="form-group">
        <label>Nome do Projeto</label>
        <input id="nome">
      </div>
      <div class="form-group">
        <label>Categoria</label>
        <select id="categoria">
          <option>Ata</option>
          <option>Requisito</option>
        </select>
      </div>
      <div class="form-group">
        <label>Área</label>
        <input id="area">
      </div>
      <div class="form-group">
        <label>Responsável</label>
        <input id="responsavel">
      </div>
      <div class="form-group">
        <label>Prazo</label>
        <input type="date" id="prazo">
      </div>
      <div class="form-group">
        <label>Link do Documento</label>
        <input id="doc">
      </div>
      <div class="form-group">
        <label>Link do Vídeo (opcional)</label>
        <input id="video">
      </div>
      <div style="display:flex;gap:10px;justify-content:end;">
        <button class="btn" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-add" onclick="salvar()">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = "https://cczuqesoozzpkvvspkic.supabase.co";
    const supabaseKey = "SUA_CHAVE_PUBLIC_AQUI"; // ⚠️ substitua pela sua chave pública anon
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    let editandoId = null;

    document.addEventListener("DOMContentLoaded", carregar);

    async function carregar() {
      const { data, error } = await supabase.from("projetos").select("*").order("prazo", { ascending: false });
      if (error) return console.error(error);
      renderTabela(data);
    }

    function renderTabela(registros) {
      const tbody = document.querySelector("#tabela tbody");
      tbody.innerHTML = "";
      registros.forEach(r => {
        tbody.innerHTML += `
          <tr>
            <td>${r.nome || "-"}</td>
            <td>${r.categoria || "-"}</td>
            <td>${r.area || "-"}</td>
            <td>${r.responsavel || "-"}</td>
            <td>${r.prazo || "-"}</td>
            <td>${r.doc ? `<a href="${r.doc}" target="_blank">Abrir</a>` : "-"}</td>
            <td>${r.video ? `<a href="${r.video}" target="_blank">🎥</a>` : "-"}</td>
            <td>
              <button class="btn btn-edit" onclick="editar('${r.id}')">✏️</button>
              <button class="btn btn-del" onclick="excluir('${r.id}')">🗑️</button>
            </td>
          </tr>`;
      });
    }

    function abrirModal() {
      document.getElementById("modalForm").style.display = "flex";
      editandoId = null;
    }

    function fecharModal() {
      document.getElementById("modalForm").style.display = "none";
    }

    async function salvar() {
      const nome = document.getElementById("nome").value;
      const categoria = document.getElementById("categoria").value;
      const area = document.getElementById("area").value;
      const responsavel = document.getElementById("responsavel").value;
      const prazo = document.getElementById("prazo").value;
      const doc = document.getElementById("doc").value;
      const video = document.getElementById("video").value;

      if (!nome || !categoria) return alert("Preencha os campos obrigatórios!");

      const registro = { nome, categoria, area, responsavel, prazo, doc, video };

      if (editandoId) {
        const { error } = await supabase.from("projetos").update(registro).eq("id", editandoId);
        if (error) return alert("Erro ao atualizar!");
      } else {
        const { error } = await supabase.from("projetos").insert(registro);
        if (error) return alert("Erro ao salvar!");
      }

      fecharModal();
      carregar();
    }

    async function editar(id) {
      const { data } = await supabase.from("projetos").select("*").eq("id", id).single();
      if (!data) return;
      document.getElementById("nome").value = data.nome || "";
      document.getElementById("categoria").value = data.categoria || "";
      document.getElementById("area").value = data.area || "";
      document.getElementById("responsavel").value = data.responsavel || "";
      document.getElementById("prazo").value = data.prazo || "";
      document.getElementById("doc").value = data.doc || "";
      document.getElementById("video").value = data.video || "";
      editandoId = id;
      abrirModal();
    }

    async function excluir(id) {
      if (!confirm("Deseja realmente excluir este registro?")) return;
      const { error } = await supabase.from("projetos").delete().eq("id", id);
      if (error) return alert("Erro ao excluir!");
      carregar();
    }
  </script>
</body>
</html>
