<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📘 Tela de Documentação – LogFit</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f8fafc;
      margin: 0;
      color: #0f172a;
    }
    header {
      background: linear-gradient(90deg, #ff5a1f, #ff7a3e);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 30px;
      box-shadow: 0 3px 8px rgba(0,0,0,.2);
    }
    header h2 {
      font-weight: 700;
      margin: 0;
    }
    header div {
      display: flex;
      gap: 10px;
    }
    header button {
      background: white;
      color: #ff5a1f;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    header button:hover {
      background: #ffe4d6;
    }

    main {
      padding: 30px;
    }
    h3 {
      color: #ff5a1f;
      margin-top: 0;
    }
    .secao {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
      margin-bottom: 30px;
    }
    button.add {
      background: #ff5a1f;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button.add:hover {
      background: #ff7a3e;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    th {
      background: #ff7a3e;
      color: white;
    }
    tr:hover td {
      background: #fdf2ec;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,.2);
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 5px 0 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: inherit;
    }
    .botoes {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn-salvar {
      background: #16a34a;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-cancelar {
      background: #475569;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .acoes button {
      border: none;
      background: transparent;
      cursor: pointer;
      color: #ff5a1f;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <header>
    <h2>📘 Tela de Documentação – LogFit</h2>
    <div>
      <button onclick="window.location.href='home.html'">🏠 Home</button>
      <button onclick="window.location.href='sprint.html'">📅 Sprint / Etapas</button>
    </div>
  </header>

  <main>
    <div class="secao">
      <h3>Atas e Documentações</h3>
      <button class="add" onclick="abrirModal()">+ Nova Ata</button>
      <table id="tabelaDocumentacao">
        <thead>
          <tr>
            <th>Projeto</th>
            <th>Descrição</th>
            <th>Link de Vídeo</th>
            <th>Descrição Detalhada</th>
            <th>Prazo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="modalNovaAta">
    <div class="modal-content">
      <h3>Nova Ata</h3>
      <input type="text" id="projeto" placeholder="Projeto" />
      <input type="text" id="descricao" placeholder="Descrição" />
      <input type="text" id="video" placeholder="Link do Vídeo (opcional)" />
      <textarea id="descricao_detalhada" placeholder="Descrição detalhada..."></textarea>
      <input type="date" id="prazo" />
      <div class="botoes">
        <button class="btn-salvar" onclick="salvarRegistro()">Salvar</button>
        <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = "https://cczuqesooeguvqimeoks.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg";
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function carregarDocumentos() {
      const { data, error } = await supabase
        .from("documentacao_atas")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        alert("Erro ao carregar registros: " + error.message);
        return;
      }

      const tbody = document.querySelector("#tabelaDocumentacao tbody");
      tbody.innerHTML = "";

      data.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.nome || ""}</td>
          <td>${item.status || ""}</td>
          <td>${item.responsavel || ""}</td>
          <td>${item.doc || ""}</td>
          <td>${item.prazo || ""}</td>
          <td class="acoes">
            <button onclick="excluirRegistro('${item.id}')">🗑️ Excluir</button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    async function salvarRegistro() {
      const nome = document.getElementById("projeto").value;
      const status = document.getElementById("descricao").value;
      const responsavel = document.getElementById("video").value;
      const doc = document.getElementById("descricao_detalhada").value;
      const prazo = document.getElementById("prazo").value;

      const { error } = await supabase
        .from("documentacao_atas")
        .insert([{ nome, status, responsavel, doc, prazo }]);

      if (error) {
        alert("Erro ao salvar: " + error.message);
      } else {
        alert("✅ Registro salvo com sucesso!");
        fecharModal();
        carregarDocumentos();
      }
    }

    async function excluirRegistro(id) {
      if (!confirm("Excluir este registro?")) return;
      const { error } = await supabase.from("documentacao_atas").delete().eq("id", id);
      if (error) {
        alert("Erro ao excluir: " + error.message);
      } else {
        carregarDocumentos();
      }
    }

    function abrirModal() {
      document.getElementById("modalNovaAta").style.display = "flex";
    }
    function fecharModal() {
      document.getElementById("modalNovaAta").style.display = "none";
      document.querySelectorAll("input, textarea").forEach(el => el.value = "");
    }

    carregarDocumentos();
  </script>
</body>
</html>
