<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogFit – Gestão de Projetos</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
:root {
  --laranja:#ff5a1f;
  --laranja2:#ff7a3e;
  --azul:#0f172a;
  --cinza:#f8fafc;
  --cinza2:#e2e8f0;
  --texto:#1e293b;
}
body {
  font-family:"Segoe UI",sans-serif;
  background:var(--cinza);
  color:var(--texto);
  margin:0;
}
header {
  background:linear-gradient(90deg,var(--laranja),var(--laranja2));
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 32px;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
}
header h2 {margin:0;font-size:20px;font-weight:700;}
header button {
  background:#fff;
  color:var(--laranja);
  border:none;
  padding:8px 14px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  margin-left:8px;
  transition:.3s;
}
header button:hover {background:#ffe4d2;}
main {max-width:1300px;margin:30px auto;padding:0 20px;}
.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:25px;
}
.card {
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 3px 8px rgba(0,0,0,.1);
  text-align:center;
  border-top:4px solid var(--laranja2);
}
.card h3 {margin:0;font-size:16px;color:#475569;}
.card span {display:block;font-size:28px;font-weight:700;color:var(--azul);margin-top:5px;}
.filtros {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin-bottom:20px;
}
.filtros input[type="text"] {
  padding:8px 10px;
  border:1px solid var(--cinza2);
  border-radius:6px;
  font-size:14px;
  width:240px;
}
.dropdown {
  position:relative;
}
.dropdown-button {
  background:#fff;
  border:1px solid var(--cinza2);
  border-radius:6px;
  padding:8px 12px;
  cursor:pointer;
  font-size:14px;
  font-weight:500;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-width:180px;
}
.dropdown-button:hover {background:#f1f5f9;}
.dropdown-content {
  display:none;
  position:absolute;
  top:110%;
  left:0;
  background:#fff;
  border:1px solid var(--cinza2);
  border-radius:8px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  z-index:1000;
  padding:10px 14px;
  max-height:200px;
  overflow-y:auto;
}
.dropdown-content label {
  display:flex;
  align-items:center;
  gap:6px;
  font-size:14px;
  margin-bottom:5px;
  color:#334155;
}
.dropdown.open .dropdown-content {display:block;}
.filtros .limpar {
  background:var(--azul);
  color:#fff;
  border:none;
  border-radius:6px;
  padding:8px 14px;
  font-weight:600;
  cursor:pointer;
  height:38px;
  display:flex;
  align-items:center;
  gap:6px;
}
.filtros .limpar:hover {background:#1e293b;}
table {
  width:100%;
  border-collapse:collapse;
  background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.1);
  border-radius:12px;
  overflow:hidden;
}
th,td {
  padding:12px 14px;
  text-align:left;
  border-bottom:1px solid var(--cinza2);
  font-size:14px;
}
th {background:#f1f5f9;font-weight:700;color:var(--azul);}
.upload-label {
  background:#e2e8f0;
  color:#0f172a;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
}
.upload-label:hover {background:#cbd5e1;}
.status-badge {
  padding:3px 8px;
  border-radius:6px;
  font-weight:600;
  font-size:12px;
  color:#fff;
}
.status-Pendente {background:#ef4444;}
.status-Desenvolvendo {background:#f59e0b;}
.status-Concluído {background:#22c55e;}
.toggle-btn {cursor:pointer;font-size:16px;transition:0.2s;}
.toggle-btn:hover {transform:scale(1.2);}
footer {
  text-align:center;
  background:var(--cinza);
  padding:12px;
  font-size:13px;
  color:#64748b;
  border-top:1px solid var(--cinza2);
}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);display:none;justify-content:center;align-items:center;z-index:1000;}
.modal-content{background:white;padding:25px;border-radius:12px;width:600px;box-shadow:0 5px 20px rgba(0,0,0,0.4);animation:fadeIn .3s ease;max-height:90vh;overflow:auto;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);} }
.etapa-linha{border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:10px;background:#f8fafc;}
.etapa-linha span{color:#ef4444;font-size:16px;cursor:pointer;float:right;}
</style>
</head>
<body>

<header>
  <h2>📊 LogFit – Gestão de Projetos</h2>
  <div>
    <button onclick="location.href='index.html'">+ Incluir / Editar Projetos</button>
    <button onclick="location.href='painel-geral.html'">🏠 Página Inicial</button>
    <button onclick="location.href='etapas.html'">📆 SPRINT</button>
    <button onclick="logout()">Sair</button>
  </div>
</header>

<main>
  <!-- CARDS -->
  <section class="cards">
    <div class="card"><h3>Total</h3><span id="total">0</span></div>
    <div class="card"><h3>📁 Backlog</h3><span id="backlog">0</span></div>
    <div class="card"><h3>⚙️ Desenvolvendo</h3><span id="desenvolvendo">0</span></div>
    <div class="card"><h3>✅ Concluídos</h3><span id="concluidos">0</span></div>
  </section>

  <!-- FILTROS -->
  <div class="filtros">
    <input type="text" id="filtroProjeto" placeholder="🔍 Filtrar por nome do projeto...">
    <div class="dropdown" id="responsavelDropdown">
      <div class="dropdown-button">Filtrar por Responsável ▾</div>
      <div class="dropdown-content" id="responsavelChecks"></div>
    </div>
    <button class="limpar" onclick="limparFiltros()">🧹 Limpar</button>
  </div>

  <!-- TABELA -->
  <table id="tabelaProjetos">
    <thead>
      <tr>
        <th></th>
        <th>Projeto</th>
        <th>Área</th>
        <th>Prioridade</th>
        <th>Status</th>
        <th>Responsável</th>
        <th>Prazo</th>
        <th>Anexo</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<!-- MODAL ETAPAS -->
<div class="modal" id="modalEtapas">
  <div class="modal-content">
    <h3>📑 Etapas do Projeto</h3>
    <div id="listaEtapas"></div>
    <button onclick="adicionarEtapa()">+ Nova Etapa</button>
    <div style="text-align:right;margin-top:15px;">
      <button onclick="salvarEtapas()" style="background:#22c55e;color:white;border:none;padding:8px 14px;border-radius:8px;font-weight:600;">💾 Salvar</button>
      <button onclick="fecharModal()" style="background:#ef4444;color:white;border:none;padding:8px 14px;border-radius:8px;font-weight:600;">Cancelar</button>
    </div>
  </div>
</div>

<footer>© LogFit Logística • Refit • 2025</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const supabase=createClient('https://cczuqesooeguvqimeoks.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg');

// LOGIN
const {data:{session}}=await supabase.auth.getSession();
if(!session) window.location.href="login.html";

// CARREGAR PROJETOS
const {data:projetos,error}=await supabase.from('projetos').select('*').order('id',{ascending:true});
if(error) console.error(error);
document.getElementById("total").textContent=projetos.length;
document.getElementById("backlog").textContent=projetos.filter(p=>p.status==="Backlog").length;
document.getElementById("desenvolvendo").textContent=projetos.filter(p=>p.status==="Desenvolvendo").length;
document.getElementById("concluidos").textContent=projetos.filter(p=>p.status==="Concluído").length;

// Responsáveis
const respDiv=document.getElementById("responsavelChecks");
[...new Set(projetos.flatMap(p=>p.responsavel?.split(",")||[]))].filter(Boolean).forEach(r=>{
  const label=document.createElement("label");
  label.innerHTML=`<input type="checkbox" value="${r}">${r}`;
  respDiv.appendChild(label);
});

// TABELA
const tbody=document.querySelector("#tabelaProjetos tbody");
renderTabela(projetos);

function renderTabela(lista){
  tbody.innerHTML="";
  lista.forEach(p=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td><button onclick="abrirModal(${p.id})">⚙️</button></td>
      <td>${p.nome}</td>
      <td>${p.area}</td>
      <td>${p.prioridade}</td>
      <td>${p.status}</td>
      <td>${p.responsavel||"—"}</td>
      <td>${p.prazo||"—"}</td>
      <td>
        <label class="upload-label" for="file_${p.id}">📎 Anexar</label>
        <input type="file" id="file_${p.id}" style="display:none" onchange="uploadArquivo(${p.id},this)">
        ${p.doc?`<br><a href="${p.doc}" target="_blank">Abrir</a>`:""}
      </td>`;
    tbody.appendChild(tr);
  });
}

// UPLOAD PRINCIPAL
window.uploadArquivo=async(id,input)=>{
  const file=input.files[0];
  if(!file) return;
  const path=`projetos/${Date.now()}_${file.name}`;
  const { error:uploadError }=await supabase.storage.from("uploads").upload(path,file);
  if(uploadError){alert("Erro ao enviar arquivo.");return;}
  const { data:urlData }=supabase.storage.from("uploads").getPublicUrl(path);
  await supabase.from("projetos").update({doc:urlData.publicUrl}).eq("id",id);
  alert("Arquivo anexado!");
  location.reload();
};

// ===== MODAL ETAPAS =====
window.abrirModal=async(id)=>{
  document.getElementById("modalEtapas").style.display="flex";
  window.projetoAtual=id;
  const {data:projeto}=await supabase.from("projetos").select("etapas").eq("id",id).single();
  const etapas=projeto?.etapas||[];
  const lista=document.getElementById("listaEtapas");
  lista.innerHTML="";
  etapas.forEach((e,i)=>{
    lista.appendChild(criarEtapaHTML(e,i));
  });
};
window.fecharModal=()=>document.getElementById("modalEtapas").style.display="none";

function criarEtapaHTML(e={},idx){
  const div=document.createElement("div");
  div.className="etapa-linha";
  div.innerHTML=`
    <span onclick="this.parentElement.remove()">🗑️</span>
    <label>Nome:</label><input type="text" value="${e.nome||""}">
    <label>Status:</label><select><option ${e.status==="Pendente"?"selected":""}>Pendente</option><option ${e.status==="Desenvolvendo"?"selected":""}>Desenvolvendo</option><option ${e.status==="Concluído"?"selected":""}>Concluído</option></select>
    <label>Responsável:</label><input type="text" value="${e.responsavel||""}">
    <label>Prazo:</label><input type="date" value="${e.prazo||""}">
    <label>Descrição:</label><textarea>${e.descricao||""}</textarea>
    <label>Anexo:</label>
      <label class="upload-label" for="etapaFile_${idx}">📎 Anexar</label>
      <input type="file" id="etapaFile_${idx}" style="display:none" onchange="uploadEtapaArquivo(this)">
      <input type="text" placeholder="ou cole o link..." value="${e.anexo||""}">
  `;
  return div;
}
window.adicionarEtapa=()=>document.getElementById("listaEtapas").appendChild(criarEtapaHTML());

window.uploadEtapaArquivo=async(input)=>{
  const file=input.files[0];
  if(!file) return;
  const path=`etapas/${Date.now()}_${file.name}`;
  const {error:err}=await supabase.storage.from("uploads").upload(path,file);
  if(err){alert("Erro no upload da etapa.");return;}
  const {data:url}=supabase.storage.from("uploads").getPublicUrl(path);
  input.parentElement.querySelector("input[type=text]").value=url.publicUrl;
  alert("Arquivo da etapa anexado!");
};

window.salvarEtapas=async()=>{
  const etapas=[...document.querySelectorAll("#listaEtapas .etapa-linha")].map(div=>{
    const inputs=div.querySelectorAll("input,select,textarea");
    return {
      nome:inputs[0].value,
      status:inputs[1].value,
      responsavel:inputs[2].value,
      prazo:inputs[3].value,
      descricao:inputs[4].value,
      anexo:inputs[6].value
    };
  });
  await supabase.from("projetos").update({etapas}).eq("id",window.projetoAtual);
  alert("Etapas salvas!");
  fecharModal();
};

// LOGOUT
window.logout=async()=>{await supabase.auth.signOut();window.location.href="login.html";}
</script>
</body>
</html>
