<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogFit – Inclusão e Edição de Projetos</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
:root{
  --laranja:#ff5a1f;
  --laranja2:#ff7a3e;
  --azul:#0f172a;
  --cinza:#f8fafc;
  --cinza2:#e2e8f0;
  --texto:#1e293b;
}
body{font-family:"Segoe UI",sans-serif;background:var(--cinza);color:var(--texto);margin:0;}
header{
  background:linear-gradient(90deg,var(--laranja),var(--laranja2));
  color:#fff;display:flex;justify-content:space-between;align-items:center;
  padding:16px 32px;box-shadow:0 3px 10px rgba(0,0,0,.2);
}
header h2{font-weight:700;font-size:20px;margin:0}
header button{
  background:#fff;color:var(--laranja);border:none;
  padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;transition:.3s;
}
header button:hover{background:#ffe4d2}
main{max-width:1300px;margin:30px auto;padding:0 20px;}
h1{text-align:center;margin-bottom:25px;font-size:26px;font-weight:700;}

/* ===== FILTROS ===== */
.filtros{
  display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:25px;position:relative;
}
.dropdown{
  position:relative;
}
.dropdown-button{
  background:#fff;border:1px solid var(--cinza2);border-radius:6px;
  padding:8px 12px;cursor:pointer;font-size:14px;font-weight:500;
  display:flex;align-items:center;justify-content:space-between;min-width:180px;
}
.dropdown-button:hover{background:#f1f5f9;}
.dropdown-content{
  display:none;position:absolute;top:110%;left:0;background:#fff;border:1px solid var(--cinza2);
  border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.1);z-index:1000;padding:10px 14px;max-height:200px;overflow-y:auto;
}
.dropdown-content label{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:5px;color:#334155;}
.dropdown.open .dropdown-content{display:block;}
.limpar{
  background:var(--azul);color:#fff;border:none;border-radius:6px;
  padding:8px 14px;font-weight:600;cursor:pointer;height:38px;display:flex;align-items:center;gap:6px;
}
.limpar:hover{background:#1e293b;}

/* ===== TABELA ===== */
table{width:100%;border-collapse:collapse;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.1);border-radius:12px;overflow:hidden;}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--cinza2);font-size:14px;}
th{background:#f1f5f9;color:var(--azul);font-weight:700;}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:6px;font-size:13px;}
input[type="file"]{display:none;}
.upload-label{display:inline-block;background:#e2e8f0;color:#0f172a;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;}
.upload-label:hover{background:#cbd5e1;}
button.adicionar{margin-top:20px;background:#0284c7;color:white;border:none;border-radius:8px;padding:12px 22px;font-weight:600;cursor:pointer;box-shadow:0 3px 8px rgba(2,132,199,0.4);transition:.3s;}
button.adicionar:hover{background:#0369a1;transform:translateY(-1px)}
.excluir{color:#ef4444;cursor:pointer;font-weight:bold;}
.status-msg{margin:15px 0;padding:10px;border-radius:8px;display:none;text-align:center;}
.status-ok{background:#dcfce7;color:#166534;}
.status-erro{background:#fee2e2;color:#991b1b;}
</style>
</head>
<body>

<header>
  <h2>⚙️ LogFit – Inclusão e Edição de Projetos</h2>
  <div>
    <button onclick="location.href='home.html'">← Voltar</button>
    <button onclick="location.href='etapas.html'">📆 SPRINT</button>
  </div>
</header>

<main>
  <h1>📋 Cadastro e Atualização de Projetos</h1>

  <!-- FILTRO DE RESPONSÁVEL -->
  <div class="filtros">
    <div class="dropdown" id="responsavelDropdown">
      <div class="dropdown-button">Filtrar por Responsável ▾</div>
      <div class="dropdown-content" id="responsavelChecks"></div>
    </div>
    <button class="limpar" onclick="limparFiltros()">🧹 Limpar</button>
  </div>

  <div id="status" class="status-msg"></div>
  <table id="tabelaProjetos">
    <thead>
      <tr>
        <th>Projeto</th>
        <th>Área</th>
        <th>Prioridade</th>
        <th>Status</th>
        <th>Responsável</th>
        <th>Prazo</th>
        <th>Anexo</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <button class="adicionar" onclick="adicionarProjeto()">+ Adicionar Projeto</button>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const SUPABASE_URL='https://cczuqesooeguvqimeoks.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjenVxZXNvb2VndXZxaW1lb2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM1OTYsImV4cCI6MjA3NjAwOTU5Nn0.zd4PY5BNZu6AVAB5xsBS_lBPSWRf6JkHqGr60Ri6oIg';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const RESPONSAVEIS=["RAFAEL","DIEGO","JOÃO","ANTONIO","LUCAS","CARLOS","IVAN","LUIZ","EQUIPE"];
let projetosGlobal=[];

// LOGIN
const {data:{session}}=await supabase.auth.getSession();
if(!session) window.location.href="login.html";

// STATUS ALERT
const statusDiv=document.getElementById("status");
function showStatus(msg,tipo="ok"){
  statusDiv.textContent=msg;
  statusDiv.className=`status-msg ${tipo==="ok"?"status-ok":"status-erro"}`;
  statusDiv.style.display="block";
  setTimeout(()=>statusDiv.style.display="none",3000);
}

// POPULA CHECKBOXES DE RESPONSÁVEIS
const respDiv=document.getElementById("responsavelChecks");
RESPONSAVEIS.forEach(r=>{
  const label=document.createElement("label");
  label.innerHTML=`<input type="checkbox" value="${r}">${r}`;
  respDiv.appendChild(label);
});

// ABRE/FECHA DROPDOWN
document.querySelectorAll('.dropdown-button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const dd=btn.parentElement;
    dd.classList.toggle('open');
  });
});
document.addEventListener('click',e=>{
  document.querySelectorAll('.dropdown').forEach(dd=>{
    if(!dd.contains(e.target)) dd.classList.remove('open');
  });
});

// FILTRAR POR RESPONSÁVEL
document.querySelectorAll('#responsavelDropdown input').forEach(i=>i.addEventListener('change',filtrarTabela));

function filtrarTabela(){
  const selecionados=[...document.querySelectorAll('#responsavelDropdown input:checked')].map(i=>i.value);
  const filtrados=selecionados.length===0
    ?projetosGlobal
    :projetosGlobal.filter(p=>selecionados.some(s=>p.responsavel?.includes(s)));
  renderTabela(filtrados);
}

window.limparFiltros=function(){
  document.querySelectorAll('#responsavelDropdown input').forEach(i=>i.checked=false);
  renderTabela(projetosGlobal);
}

// CARREGAR TABELA
async function carregarTabela(){
  const tbody=document.querySelector("#tabelaProjetos tbody");
  tbody.innerHTML="";
  const { data, error } = await supabase.from("projetos").select("*").order("id",{ascending:true});
  if(error){showStatus("Erro ao carregar","erro");return;}
  projetosGlobal=data||[];
  renderTabela(projetosGlobal);
}

function renderTabela(lista){
  const tbody=document.querySelector("#tabelaProjetos tbody");
  tbody.innerHTML="";
  if(!lista.length){
    tbody.innerHTML=`<tr><td colspan="8" style="text-align:center;color:#64748b;">Nenhum projeto encontrado.</td></tr>`;
    return;
  }
  lista.forEach(p=>{
    const responsaveis=p.responsavel?p.responsavel.split(","):[];
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td contenteditable onblur="editar(${p.id},'nome',this.innerText)">${p.nome||"Novo Projeto"}</td>
      <td><select onchange="editar(${p.id},'area',this.value)">
        ${["Planejamento","Programação","Transportadores","Logística","Corporativo","Outros"]
          .map(a=>`<option ${a===p.area?"selected":""}>${a}</option>`).join("")}
      </select></td>
      <td><select onchange="editar(${p.id},'prioridade',this.value)">
        ${["Alta","Média","Baixa"].map(a=>`<option ${a===p.prioridade?"selected":""}>${a}</option>`).join("")}
      </select></td>
      <td><select onchange="editar(${p.id},'status',this.value)">
        ${["Backlog","Desenvolvendo","Concluído"].map(a=>`<option ${a===p.status?"selected":""}>${a}</option>`).join("")}
      </select></td>
      <td><select multiple onchange="salvarResponsaveis(${p.id},this)">
        ${RESPONSAVEIS.map(r=>`<option ${responsaveis.includes(r)?"selected":""}>${r}</option>`).join("")}
      </select></td>
      <td><input type="date" value="${p.prazo||""}" onchange="editar(${p.id},'prazo',this.value)"></td>
      <td>
        <label for="file_${p.id}" class="upload-label">📎 Anexar</label>
        <input type="file" id="file_${p.id}" onchange="uploadArquivo(${p.id},this)">
        ${p.doc?`<br><a href="${p.doc}" target="_blank">Abrir</a>`:""}
      </td>
      <td><span class="excluir" onclick="excluir(${p.id})">🗑️</span></td>`;
    tbody.appendChild(tr);
  });
}

// UPLOAD DE ARQUIVO PARA SUPABASE STORAGE
window.uploadArquivo=async(id,input)=>{
  const file=input.files[0];
  if(!file)return;
  const filePath=`projetos/${Date.now()}_${file.name}`;
  const { error:uploadError }=await supabase.storage.from("uploads").upload(filePath,file);
  if(uploadError){showStatus("Erro no upload","erro");return;}
  const { data:publicURL }=supabase.storage.from("uploads").getPublicUrl(filePath);
  await editar(id,"doc",publicURL.publicUrl);
  showStatus("Arquivo anexado!");
  carregarTabela();
}

// CRUD
window.adicionarProjeto=async()=>{
  const {error}=await supabase.from("projetos").insert([{nome:"Novo Projeto"}]);
  if(error) showStatus("Erro ao adicionar","erro");
  else {showStatus("Projeto criado!");carregarTabela();}
}

window.editar=async(id,campo,valor)=>{
  const {error}=await supabase.from("projetos").update({[campo]:valor}).eq("id",id);
  if(error) showStatus("Erro ao atualizar","erro");
}

window.salvarResponsaveis=(id,select)=>{
  const valores=[...select.selectedOptions].map(o=>o.value).join(",");
  editar(id,"responsavel",valores);
}

window.excluir=async(id)=>{
  if(confirm("Excluir este projeto?")){
    const {error}=await supabase.from("projetos").delete().eq("id",id);
    if(error) showStatus("Erro ao excluir","erro");
    else {showStatus("Excluído com sucesso!");carregarTabela();}
  }
}

carregarTabela();
</script>
</body>
</html>
